# DC-17m with the sniper attachment: slow, accurate, hard-hitting, with a
# two-step zoom. In the original the attachment swaps onto the rifle; here
# it is its own entry in the weapon cycle with its own ammo.
#
# Numbers marked "game:" are DC17mSniper's class defaults (ctinventory.u,
# with DC17mSniperDefaults in Properties/properties.u on top). "placeholder"
# marks the few not read yet.

name = "DC-17m Sniper"

[fire]
mode = "semi_auto"        # game: one shot per press
shot_delay = 1.5          # game: DC17mSniperDefaults ShotDelay
aim_error = 0             # game: no AimError
offset = [130.4, 13, -6.56] # game: FPFireOffset
zoom_fovs = [30, 10]      # game: ZoomFOVs (degrees across 4:3; the zoom button steps through them)
zoom_damage = 1.72        # game: ZoomDamageMultiplier (shots while zoomed)

[ammo]
clip_size = 5             # game: ReloadCount
max_ammo = 20             # game: DC17mSniperAmmoDefaults MaxAmmo
start_ammo = 20           # game: PickupAmmoCount
reload_time = 2.6         # game: the arms' Reload animation, 78 frames at 30 fps

[shot]
kind = "instant"          # game: an instant-hit trace
range = 10000             # game: TraceRange
damage = 175              # game: Damage
damage_kind = "blaster"
damage_type = "CTDamageBallisticDC17Sniper" # game: MyDamageType

[melee]
range = 150               # game: MeleeRange
damage = 220              # game: MeleeDamage

[recoil]
kick = [2500, 0, 0]       # game: WeaponKick
spring = 15               # game: RecoilConstant
damping = 0.2             # game: RecoilDampening

[sound]
package = "gen_sound"
fire = ["wep_GEN_sniperFire_01"] # game: FireSound
empty = "wep_GEN_empty_01"

[model]
package = "weapons"
mesh = "DC17mBlaster"     # placeholder: the rifle's model until the attachment's is read
offset = [40, 12, -14]
bolt_colour = [0.3, 0.7, 1.0]

[arms]
# The first-person arms holding it: an animated model read from the game
# at run time (Animations/hudarms.ukx). Leave this section out to show the
# plain [model] in view instead.
mesh = "HudArmsSniper"     # game: DC17mSniper's Mesh
fov = 85                  # game: DisplayFOV (degrees across 4:3, whatever the view setting)
attachment_group = "dc17m" # our name: weapons that swap with AttachHolster/AttachLoad
hide_zoomed = true        # game: bZoomedUsesNoHUDArms (the scope covers the view)
brightness = 0.75         # our choice: the game lights the arms by the zone, not read yet
