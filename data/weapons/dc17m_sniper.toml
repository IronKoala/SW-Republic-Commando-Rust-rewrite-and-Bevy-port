# DC-17m with the sniper attachment: slow, accurate, hard-hitting, with a
# zoom. In the original the attachment swaps onto the rifle; here it is its
# own entry in the weapon cycle with its own ammo.
#
# !! PLACEHOLDER NUMBERS !! Values marked "placeholder" are our own stand-ins,
# NOT yet read from the original game. They will be replaced with the class
# defaults from ctinventory.u (with its "...Defaults" class in
# Properties/properties.u on top) once the game's packages can be read.
# Class name to check: DC17mSniper.

name = "DC-17m Sniper"

[fire]
mode = "semi_auto"        # placeholder
shot_delay = 1.0          # placeholder
aim_error = 0             # placeholder
offset = [127.4, 30, -10] # the DC-17m's FPFireOffset (placeholder for the attachment)
zoom_fov = 30             # placeholder: degrees across 4:3 while zoomed (zoom button)

[ammo]
clip_size = 5             # placeholder
max_ammo = 30             # placeholder
start_ammo = 15           # placeholder
reload_time = 2.0         # placeholder

[shot]
kind = "bolt"
accel = 200000            # placeholder
max_speed = 30000         # placeholder
life_span = 2
damage = 150              # placeholder
damage_kind = "blaster"

[recoil]
kick = [600, -100, 0]     # placeholder
spring = 10               # placeholder
damping = 0.1             # placeholder

[sound]
package = "gen_sound"
fire = ["wep_GEN_dc17Fire_02"]      # placeholder: the rifle's own sound until the sniper's is read
empty = "wep_GEN_empty_01"

[model]
package = "weapons"
mesh = "DC17mBlaster"     # placeholder: the rifle's model until the attachment's is read
offset = [40, 12, -14]
bolt_colour = [0.3, 0.7, 1.0]
