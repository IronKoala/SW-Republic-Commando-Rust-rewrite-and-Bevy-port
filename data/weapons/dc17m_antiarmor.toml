# DC-17m with the anti-armour attachment: fires a grenade round that goes
# off on impact (its blast is grenades/dc17m_antiarmor_round.toml). Its own
# entry in the weapon cycle with its own ammo.
#
# !! PLACEHOLDER NUMBERS !! Values marked "placeholder" are our own stand-ins,
# NOT yet read from the original game. They will be replaced with the class
# defaults from ctinventory.u (with its "...Defaults" class in
# Properties/properties.u on top) once the game's packages can be read.
# Class name to check: DC17mAntiArmor.

name = "DC-17m Anti-Armour"

[fire]
mode = "semi_auto"        # placeholder
shot_delay = 1.0          # placeholder
aim_error = 0             # placeholder
offset = [127.4, 30, -10] # the DC-17m's FPFireOffset (placeholder for the attachment)

[ammo]
clip_size = 1             # placeholder
max_ammo = 6              # placeholder
start_ammo = 3            # placeholder
reload_time = 1.5         # placeholder

[shot]
kind = "lobbed"           # flies like a grenade
speed = 3000              # placeholder: uu/s
grenade = "dc17m_antiarmor_round"

[recoil]
kick = [800, -200, 0]     # placeholder

[sound]
package = "gen_sound"
empty = "wep_GEN_empty_01"

[model]
package = "weapons"
mesh = "DC17mBlaster"     # placeholder: the rifle's model until the attachment's is read
offset = [40, 12, -14]
