# The Trandoshan mercenary's ACP repeater (class SMG): a fast instant-hit
# gun. Trandoshans drop it when they fall, and the player can pick it up.
#
# The values are the original game's: class SMG (ctinventory.u) with
# SMGDefaults (Properties/properties.u) on top, and its ammo SMGAmmo
# (+Defaults).

name = "ACP Repeater"

[fire]
mode = "automatic"        # FireMode 2
shot_delay = 0.1          # SMGDefaults ShotDelay
aim_error = 25            # SMGDefaults AimError
offset = [127.4, 10, -7.56] # SMG FPFireOffset

[ammo]
clip_size = 40            # SMGDefaults ReloadCount
max_ammo = 160            # SMGAmmoDefaults MaxAmmo
start_ammo = 160          # SMGDefaults PickupAmmoCount
reload_time = 2.17        # game: the arms' Reload animation (HudArmsUzi), 65 frames at 30 fps

[shot]
kind = "instant"          # SMGAmmo bInstantHit
range = 5000              # SMGAmmo Range
damage = 10               # SMGAmmoDefaults Damage
damage_kind = "blaster"
damage_type = "CTDamageBallisticSMG" # MyDamageType

[melee]
range = 150               # SMGDefaults MeleeRange
damage = 220              # SMGDefaults MeleeDamage

[recoil]
kick = [200, 200, 0]      # SMGDefaults WeaponKick
spring = 4                # SMGDefaults RecoilConstant
damping = 0.1             # SMG RecoilDampening

[sound]
package = "gen_sound"     # checked: Uzi_Fire is in gen_sound.uax
fire = ["Uzi_Fire"]       # SMGDefaults FireSound: a group (SoundMultiple) holding wep_GEN_UziFireNew_04

[model]
package = "weapons"
mesh = "DroidBlaster"     # placeholder: the repeater's own model isn't looked up yet
offset = [40, 12, -14]
bolt_colour = [1.0, 0.6, 0.2]  # our choice, from the tracer light's hue 18

[arms]
# The first-person arms holding it: an animated model read from the game
# at run time (Animations/hudarms.ukx). Leave this section out to show the
# plain [model] in view instead.
mesh = "HudArmsUzi"        # game: SMG's Mesh
fov = 85                  # game: DisplayFOV (degrees across 4:3, whatever the view setting)
brightness = 0.75         # our choice: the game lights the arms by the zone, not read yet
