# Character shadows, as the original draws them. Read by rc_shadows when
# the game starts.
#
# In the original, a character the map marks with `bActorShadows` (and
# every Delta commando, whose class sets it) gets a "shadow projector": a
# small picture of the character's shape, seen from a light high above,
# laid onto the floor beneath it. The numbers below are the ones the
# original's own script code and class defaults use (Engine.Pawn,
# Engine.ShadowProjector, Engine.ShadowBitmapMaterial), read from the
# install. Nothing here is copied from the game, only the values.
#
# The original only draws them with SQUAD SHADOWS on in the graphics
# options (its "Shadows" setting); so do we.
#
# Mods: change any value and restart. If the file can't be read, the log
# says why and the game uses the values built into the game, which are
# this file as it ships.

# Where the light comes from, as an Unreal direction (X, Y, Z; Z is up):
# the original uses Normal(vect(1,1,3)) for every character, so all
# shadows fall the same way, a little to one side.
light_direction = [1.0, 1.0, 3.0]

# How far the shadow reaches from the middle of the body, Unreal units
# (ShadowProjector MaxTraceDistance 350). The shadow fades towards this
# distance, so a character high above the floor casts a fainter one.
max_trace_distance = 350.0

# Shadows farther than this from the camera aren't drawn, Unreal units
# (ShadowProjector CullDistance 1200).
cull_distance = 1200.0

# How dark the shadow is where it is darkest, 0 (none) to 1 (black).
# ShadowBitmapMaterial ShadowDarkness is 255 (full). How the original's
# blending turns that into a final darkness isn't known for sure; with
# the fade above, a standing trooper's shadow comes out at about 0.75.
darkness = 1.0

# How far above the floor the shadow is drawn, Unreal units, so the floor
# doesn't hide it. Our choice.
lift = 1.0
