# Music: our own choices, where the game's files say nothing.
#
# The music itself and the rules for when it plays come from the game's own
# files at run time, not from here:
# - the pieces, their fades, loops and loudness: GameData/Sounds/*_music.uax
# - room music: the map's volumes and GameData/Properties/audioenv.u
# - battle music and when a fight starts: the map's LevelInfo, its battle
#   volumes and its scripts; the timings (a check each second, the 2 second
#   end delay, the 5 second fade) are the engine's own, read from Engine.dll
# - menu music: each menu's BackgroundMusic in XInterfaceCTMenus.u
# See "Music" in docs/DESIGN.md.

# Fade, in seconds, for room overlays cut short by a fight or a script.
overlay_stop_fade = 1.0

# The "player down" loop, for levels whose battle music doesn't name one
# (every battle group in the game names this same piece).
player_down = "musGEN_playerincap_lp"

# Mods: set this to a piece name from the music packages to replace the
# main menu music. Empty keeps the original's (the sung "Vode An").
menu = ""
