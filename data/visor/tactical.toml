# The commando's visor modes (read by rc_visor). Press CYCLE VISOR MODE
# (X) to step through normal, tactical and low light; the GAME options page
# sets which modes it steps through and how strong the tactical glow is.
#
# In tactical mode squad mates glow in their own colour and things to pick
# up glow pale blue. The colours are read at run time from the game's
# classes named below (each class's EnhancedVisionColor); nothing from the
# game is stored here. Enemies, walls and props have no glow colour in the
# original, so they don't glow.

# Script packages searched for the classes below, in the install.
packages = [
    "GameData/System/Engine.u",
    "GameData/System/CTGame.u",
    "GameData/System/CTCharacters.u",
    "GameData/System/CTInventory.u",
    "GameData/Properties/Properties.u",
]

# The glow's shape. Our own guess: the original draws it in its compiled
# renderer, which we can't read. Compare with the real game and adjust.
[glow]
# Strength at TACTICAL MODE INTENSITY 10. The original's default is 2.
strength_scale = 2.5
# How sharply the glow gathers at a body's edges (higher: thinner outline).
edge_power = 2.0
# Share of the glow that also covers the middle of a body, 0 to 1.
fill = 0.12

# What glows, and which original class's colour it takes. Squad mates by
# name in lower case (as in data/squad/squad.toml).
[colours]
sev = "Commando07DeltaDefaults"
fixer = "Commando40DeltaDefaults"
scorch = "Commando62DeltaDefaults"
# Every weapon, ammo box and bacta pickup in the original uses this colour.
pickup = "CTPickupDefaults"

# Colours used instead of the game's: red, green, blue from 0 to 255.
# For mods, or for something the original doesn't colour.
[colour_overrides]
# sev = [255, 40, 40]

# The helmet lamp in low light mode (on together with the picture below).
[headlamp]
lumens = 400000.0
range = 1500.0
angle = 50.0

# The low light mode's night-vision picture. The look is the original's:
# its numbers and pictures are read at run time from the vision mode named
# below (its film grain strength, its distance fog, the shader's visor-shaped
# window and film grain pictures). The picture turns black and white (each
# pixel's red, green and blue squared and added up), is seen through the
# visor window, and gets the grain. The lines below change it or stand in
# when the game folder can't be read. Every line can be left out.
[low_light]
# false: low light mode is only the helmet lamp.
picture = true
# The original's vision mode object the look is read from.
mode = "FrameFX.VisionModes.VisionNight"
# Brightness boost on top of the original's (1 is the original).
boost = 1.0
# Colour the black and white picture is tinted to: red, green, blue from 0
# to 255. White is the original; for example [150, 255, 170] for green.
tint = [255, 255, 255]
# See through the original's visor-shaped window (outside it is black).
# Switch off for a full-screen picture (VR headsets will want this).
window = true
# On screens wider than 4:3 the window is widened, not stretched: this much
# of its middle (in screen heights each side of the centre) and its outer
# parts keep their shape, and the plain part between them is drawn longer.
window_middle = 0.25
# Times the original's film grain strength (0 for none).
grain_scale = 1.0
# Use the mode's own distance fog: far things fade into the dark.
fog = true
# Seconds the picture takes to fade in from black.
fade_seconds = 0.2
# Used only when the game folder can't be read: grain strength (0 to 1),
# grain repeats across and down a 4:3 screen, fog start and end (Unreal
# units). Our guesses close to the original's.
fallback_grain = 0.12
fallback_grain_tiles = [9.0, 6.5]
fallback_fog = [555.0, 4500.0]

# Static on the view near a jamming device's interference generator (geo_03a).
# As in the original, the static is added to the vision mode's own film
# grain: in low light mode to the night-vision grain, in normal and tactical
# mode the plain modes' shaders add only grain to the picture. Their grain
# repeats are read at run time from the modes named below. Every line can be
# left out.
[helmet_static]
# false: no static picture (the hiss still plays).
picture = true
normal_mode = "FrameFX.VisionModes.VisionNormal"
tactical_mode = "FrameFX.VisionModes.VisionEnhance"
# The shader a mode uses when it names none (the original's default).
default_shader = "FrameFX.VisionShaders.VisionShaderNormal"
# Used only when the game folder can't be read: grain repeats across and
# down a 4:3 screen.
fallback_tiles = [6.3, 6.7]
