# Clone trooper of the first Geonosis level's trench battle
# (CloneTrooperTM, which geo_01a's spawners make; 9 spawners there). They
# fight on the player's side: they shoot the droids, the droids shoot
# them, and they leave the player and the squad alone.
#
# Numbers marked "game:" are the original's, read with `rc_probe --class`:
# CloneTrooperTM (Properties/properties.u), its parent CloneTrooper
# (System/ctcharacters.u) and Pawn (engine.u); its brain CloneTrooperBot
# (ctcharacters.u) and CTBot (ctgame.u); its rifle DC15BlasterCloneTM
# (data/weapons/dc15_blaster_clone_tm.toml). Anything not listed takes the
# battle droid's value (battle_droid.toml).
#
# How they fight: CloneTrooperBot's attack state is the game's
# StateTrandoshanAttack (`[attack] state = "trandoshan"`). How it uses its
# numbers was read from the game's compiled AI code (written up in our own
# words in docs/DESIGN.md "Clone trooper AI"); the numbers are below.

[type]
id = "clone_trooper_tm"
name = "clone trooper"
classes = ["CloneTrooperTM"] # game: the map class
body = "organic"
side = "republic"         # game: CloneTrooper TeamIndex 2, the player's team (droids are 5)

[movement]
ground_speed = 450        # game: CloneTrooper GroundSpeed
accel_rate = 1024         # game: CloneTrooper AccelRate
walk_speed_ratio = 0.5    # game: Pawn WalkSpeedRatio
collision_radius = 40     # game: Pawn CollisionRadius
collision_height = 84     # game: CloneTrooper CollisionHeight
crouch_radius = 40        # game: Pawn CrouchRadius
crouch_height = 56        # game: CloneTrooper CrouchHeight
base_eye_height = 60      # game: CloneTrooper BaseEyeHeight
side_speed_ratio = 0.8    # game: Pawn SideSpeedRatio

[senses]
sight_radius = 10000      # game: Pawn SightRadius (the trooper classes don't change it)
peripheral_vision = 0.2   # game: Pawn PeripheralVision
auto_detect_radius = 200  # game: Pawn AutoDetectRadius
enemy_memory_time = 15    # game: CTBot EnemyMemoryTime
decision_interval = 0.5   # game: CTBot DecisionInterval
turn_rate = 110           # game: Pawn RotationRate yaw 20000 per second

[combat]
health = 100              # game: CloneTrooper Health
accuracy = 0.4            # game: CloneTrooperTM Accuracy
weapon = "dc15_blaster_clone_tm" # game: CloneTrooperTM RequiredEquipment Properties.DC15BlasterCloneTM
burst_count = 15          # game: CloneTrooperBot BurstCount (the rifle's own BurstCount is 4)
shot_delay = 0.1          # game: DC15BlasterCloneTM ShotDelay
weapon_range = 7000       # game: Weapon ValidRange max
max_aim_yaw = 80          # game: Pawn MaxAimYaw
can_crouch = false        # game: CloneTrooper bCanCrouch = false
uses_cover = true         # game: the trooper's attack state looks for cover each time it plans
auto_aim_offset = 0       # game: CloneTrooper sets no AutoAimOffset (0)
max_aim_error = 30        # game: the original's aim error limit is (1 - Accuracy) x 30 degrees
melee_range = 150         # game: DC15BlasterClone MeleeRange (the rifle butt)
melee_damage = 100        # game: DC15BlasterClone MeleeDamage
melee_damage_type = "CTDamageMelee" # game: DC15BlasterClone MeleeDamageType
drops = ""                # game: DC15BlasterClone has no DroppedPickupClass
damage_table = ""         # game: no MyDamageVariance on the trooper classes: every hit counts in full

[attack]
state = "trandoshan"      # game: CloneTrooperBot RequiredStates StateTrandoshanAttack
weapon_burst_count = 4    # game: DC15BlasterClone BurstCount (the rifle's; the bot's is 15)
optimal_dist = 10000      # game: DC15BlasterClone OptimalDist
cover_range = 100000      # game: DC15BlasterCloneAmmo Range (how far from it cover is looked for)
min_step_interval = 10    # game: StateTrandoshanAttack MinStepInterval
cover_hide_min = 0.5      # game: StateTrandoshanAttack CoverHideTime min
cover_hide_max = 2.0      # game: StateTrandoshanAttack CoverHideTime max
emote_probability = 0.5   # game: CTBot EmoteProbability
emote = "EmoteSeeEnemy"   # game: the gesture the state plays; the trooper mesh finds it in CloneCommandoSPSet
emote_time = 0.8333       # game: EmoteSeeEnemy is 25 frames at 30 a second
can_side_step = true      # game: CloneTrooper bCanSideStep
gun_height = 0            # game: GunHeight is not set for troopers (CTPawn default 0)
step_distance = 160       # game: StepLeft/StepRight move the root bone 160 uu sideways
step_left_time = 1.3667   # game: StepLeft is 41 frames at 30 a second
step_right_time = 1.3     # game: StepRight is 39 frames at 30 a second
melee_anim = "MeleeAttack" # game: the animation the state plays for a close-up hit
melee_time = 1.0          # game: MeleeAttack is 30 frames at 30 a second
melee_hit_at = 0.2963     # game: MeleeAttack's AnimNotify_MeleeHit time
post_world_check_fire_duration = 0 # game: CTBot PostWorldCheckFireDuration is not set (0)
dodge_error_time = 1.0    # game: CTBot DodgeErrorTime

[sound]
# game: none of the trooper classes sets an AudioTable, so they say
# nothing (the battle droid's lines are switched off here).
spotted = []
hurt = []
death = []
hurt_explosion = []
death_explosion = []
hurt_electrical = []
death_electrical = []
hurt_melee = []
hurt_fall = []
death_fall = []

[look]
# game: CloneTrooper Mesh = Clone.CloneTrooper, drawn with the mesh's own
# material (CloneTextures CloneTrooper_Shader; the class sets no Skins).
# Its everyday moves come from CloneCommandoSet, which has every name the
# battle droid file uses.
package = "GameData/Animations/clone.ukx"
mesh = "CloneTrooper"
skin = ""
held_weapon = "DC15BlasterCloneTM" # game: RequiredEquipment; its AttachmentClass model hangs on bone weaponAttach_R
throw = "ThrowGrenade"    # not used: troopers carry no grenades
ambient = 0.5             # the same as the cast's troopers (data/cast/cast.toml)
light_scale = 1.1         # the same as the cast's troopers
