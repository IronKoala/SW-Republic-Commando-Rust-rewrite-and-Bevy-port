# Trandoshan slaver grenadier: a slaver who throws thermal detonators
# whenever it can, and carries no blades.
#
# Numbers marked "game:" are the original's: TrandoshanSlaverGrenadier
# (Properties/properties.u), made from TrandoshanSlaver (ctcharacters.u),
# and its brain TrandoshanSlaverGrenadierBot. Anything not listed takes the
# battle droid's value (battle_droid.toml).

[type]
id = "trandoshan_slaver_grenadier"
name = "Trandoshan slaver grenadier"
classes = ["TrandoshanSlaverGrenadier"] # game: the map class
body = "organic"

[movement]
ground_speed = 338        # game: TrandoshanSlaver GroundSpeed
accel_rate = 1000         # game: TrandoshanSlaver AccelRate
collision_radius = 50     # game: CollisionRadius
collision_height = 75     # game: CollisionHeight
crouch_radius = 50        # game: CrouchRadius
crouch_height = 50        # game: CrouchHeight
base_eye_height = 60      # game: BaseEyeHeight

[senses]
sight_radius = 5000       # game: TrandoshanSlaverGrenadier SightRadius

[combat]
auto_aim_offset = 30      # game: TrandoshanSlaverGrenadier AutoAimOffset
health = 150              # game: TrandoshanSlaver Health and MaxHealth
accuracy = 0.65           # game: TrandoshanSlaverGrenadier Accuracy
max_aim_yaw = 70          # game: MaxAimYaw
weapon = "trandoshan_shotgun" # game: TrandoshanSlaverGrenadier RequiredEquipment Shotgun
burst_count = 2           # game: TrandoshanSlaverBot BurstCount
shot_delay = 1.1          # game: ShotgunDefaults ShotDelay
weapon_range = 3500       # game: ShotgunAmmoDefaults Range
drops = ""                # not yet: the player can't carry the shotgun
damage_table = "DV_OrganicTrandoSlaverDamage" # game: MyDamageVariance

[grenades]
grenade = "thermal_detonator_enemy" # game: RequiredEquipment[1] ThermalDetonatorEnemy
count = 2                 # game: ThermalDetonatorEnemyDefaults InitAmmoAmount
probability = 0.85        # game: TrandoshanSlaverGrenadierBot GrenadeProbability
min_time = 5              # game: TrandoshanSlaverGrenadierBot MinGrenadeTime
throw_time = 0.87         # game: TrandoshanSlaverSet ThrowGrenade (26 frames at 30 a second)

[sound]
# game: TranSlavAudio, the slaver's table (see trandoshan_slaver.toml).
package = "character_voice"
spotted = ["TSR_SpottedEnemy"]
hurt = ["TSR_HurtSmallArms"]
death = ["TSR_DieSmallArms"]
hurt_explosion = ["TSR_HurtExplosion"]
death_explosion = ["TSR_DieExplosion"]
hurt_electrical = ["TSR_HurtElectricity"]
death_electrical = ["TSR_DieElectricity"]
hurt_melee = ["TSR_HurtMelee"]
death_fire = ["TSR_DieFire"]
hurt_fall = ["TSR_HurtFall"]
death_fall = ["TSR_DieFall"]
hurt_interval = 2.0       # our choice

[look]
package = "GameData/Animations/trandoshan.ukx"
mesh = "TrandoshanSlaver" # game: the slaver's model
throw = "ThrowGrenade"    # game: TrandoshanSlaverSet
