# Super battle droid (B2): slow, heavily armoured, fires a wrist blaster
# in bursts, walks straight at you instead of taking cover.
#
# Numbers marked "game:" are the original's: SuperBattleDroid (ctcharacters.u)
# with SuperBattleDroidDefaults (Properties/properties.u) on top, and its
# brain SuperBattleDroidBot(+Defaults). "guess"/"our choice" mark the rest.
# Anything not listed takes the battle droid's value (battle_droid.toml).

[type]
id = "super_battle_droid"
name = "super battle droid"
classes = ["SuperBattleDroid*"]  # game: the map class (SuperBattleDroid, and its variants)
body = "droid"

[movement]
ground_speed = 100        # game: GroundSpeed (WalkSpeedRatio 1: it never runs)
collision_radius = 65     # game: CollisionRadius
collision_height = 115    # game: CollisionHeight
crouch_height = 85        # game: CrouchHeight
base_eye_height = 60      # game: BaseEyeHeight

[senses]
sight_radius = 5000       # game: SightRadius
peripheral_vision = 0.2   # game: PeripheralVision (Pawn)

[combat]
health = 500              # game: SuperBattleDroidDefaults MaxHealth
accuracy = 0.9            # game: Accuracy
weapon = "sbd_blaster"    # game: RequiredEquipment SBDBlaster (data/weapons/sbd_blaster.toml)
burst_count = 3           # game: SuperBattleDroidBotDefaults BurstCount
shot_delay = 0.2          # game: SBDBlaster ShotDelay
max_aim_yaw = 90          # game: MaxAimYaw
weapon_range = 7000       # game: Weapon ValidRange max
ready_distance = 600      # guess
safe_distance = 900       # guess
uses_cover = false        # guess: walks at you instead
drops = ""                # game: the blaster is built in
damage_table = "DV_DroidsSuperBattleDroidDamage" # game: MyDamageVariance

[sound]
# What the droid says. Names are groups (SoundMultiple) in
# GameData/Sounds/character_voice.uax; each time one line from the group
# plays. List a package's sounds with
# `rc_probe --sounds "<game>\GameData\Sounds\<package>.uax"`.
#
# game: SuperBattleDroid AudioTable = SBDAudio (System/ctaudio.u), a table of one
# group per event (engine.u EPawnAudioEvent). "hurt_<kind>" and
# "death_<kind>" are used when that kind of damage did it (blaster,
# explosion, sonic, electrical, fire, melee, fall, other); otherwise
# "hurt" and "death". Only the kinds the game's table has are listed.
# Its other lines (LargeArms, Quiet, HeardSomething, SearchAbort,
# SeeGrenade, KilledExcited, Retreat, ...) aren't hooked up yet.
package = "character_voice"
spotted = ["SBD_SpottedEnemy"]       # game: PAE_SpottedEnemy
hurt = ["SBD_HurtSmallArms"]         # game: PAE_HurtSmallArms
death = ["SBD_DieSmallArms"]         # game: PAE_DieSmallArms
hurt_explosion = ["SBD_HurtExplosion"]
death_explosion = ["SBD_DieExplosion"]
hurt_electrical = ["SBD_HurtElectricity"]
death_electrical = ["SBD_DieElectricity"]
hurt_fall = ["SBD_HurtFall"]
death_fall = ["SBD_DieFall"]
hurt_interval = 2.0                    # our choice: seconds between hurt lines from one character

[look]
package = "GameData/Animations/droid.ukx"   # placeholder
mesh = "SuperBattleDroid"                    # placeholder
