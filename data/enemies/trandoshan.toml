# Trandoshan mercenary: organic, tougher than a battle droid, sprays an
# instant-hit repeater in long bursts, and the player can pick it up.
#
# Numbers marked "game:" are the original's: TrandoshanMercenary
# (ctcharacters.u) with TrandoshanMercenaryDefaults (Properties/properties.u)
# on top, and its brain TrandoshanMercenaryBot(+Defaults). "guess" and
# "placeholder" mark the rest. Anything not listed takes the battle droid's
# value (battle_droid.toml).

[type]
id = "trandoshan"
name = "Trandoshan mercenary"
classes = ["TrandoshanMercenary*"]  # game: the map class
body = "organic"

[movement]
ground_speed = 450        # game: GroundSpeed
collision_radius = 40     # game: CollisionRadius (Pawn)
collision_height = 84     # game: CollisionHeight
crouch_height = 56        # game: CrouchHeight
base_eye_height = 60      # game: BaseEyeHeight

[combat]
health = 220              # game: MaxHealth
accuracy = 0.65           # game: Accuracy
max_aim_yaw = 70          # game: MaxAimYaw
weapon = "trandoshan_smg" # game: RequiredEquipment SMG (data/weapons/trandoshan_smg.toml)
burst_count = 9           # game: TrandoshanMercenaryBotDefaults BurstCount
shot_delay = 0.1          # game: SMGDefaults ShotDelay
weapon_range = 5000       # game: SMGAmmo Range
drops = "trandoshan_smg"  # the player can pick up its repeater
damage_table = "DV_OrganicTrandoMercDamage" # game: MyDamageVariance

[grenades]
grenade = "thermal_detonator_enemy" # game: RequiredEquipment[1] ThermalDetonatorEnemy (data/grenades/thermal_detonator_enemy.toml)
count = 2                 # game: ThermalDetonatorEnemyDefaults InitAmmoAmount
probability = 0.05        # game: TrandoshanMercenaryBotDefaults GrenadeProbability
min_time = 20             # game: TrandoshanMercenaryBotDefaults MinGrenadeTime
throw_time = 0.87         # game: the ThrowGrenade animation's length (26 frames at 30 a second)

[sound]
# What the mercenary says. Names are groups (SoundMultiple) in
# GameData/Sounds/character_voice.uax; each time one line from the group
# plays. List a package's sounds with
# `rc_probe --sounds "<game>\GameData\Sounds\<package>.uax"`.
#
# game: TrandoshanMercenary AudioTable = TranMercAudio (System/ctaudio.u), a table of one
# group per event (engine.u EPawnAudioEvent). "hurt_<kind>" and
# "death_<kind>" are used when that kind of damage did it (blaster,
# explosion, sonic, electrical, fire, melee, fall, other); otherwise
# "hurt" and "death". Only the kinds the game's table has are listed.
# Its other lines (LargeArms, Quiet, HeardSomething, SearchAbort,
# SeeGrenade, KilledExcited, Retreat, ...) aren't hooked up yet.
package = "character_voice"
spotted = ["TMC_SpottedEnemy"]       # game: PAE_SpottedEnemy
hurt = ["TMC_HurtSmallArms"]         # game: PAE_HurtSmallArms
death = ["TMC_DieSmallArms"]         # game: PAE_DieSmallArms
hurt_explosion = ["TMC_HurtExplosion"]
death_explosion = ["TMC_DieExplosion"]
hurt_electrical = ["TMC_HurtElectricity"]
death_electrical = ["TMC_DieElectricity"]
hurt_fire = ["TMC_HurtFire"]
death_fire = ["TMC_DieFire"]
hurt_fall = ["TMC_HurtFall"]
death_fall = ["TMC_DieFall"]
hurt_interval = 2.0                    # our choice: seconds between hurt lines from one character

[look]
package = "GameData/Animations/trandoshan.ukx"  # guess: the game's mesh TrandoshanMerc isn't in this package
mesh = "Trandoshan"                             # placeholder: the closest mesh in trandoshan.ukx
throw = "ThrowGrenade"                           # game: the Trandoshan sets' throwing animation
