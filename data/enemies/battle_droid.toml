# Battle droid (B1) settings: the Geonosis trench variant, BattleDroidTM,
# which is what geo_01a's spawners create.
#
# Mods: change any number here and restart. Delete a line to use the
# built-in value. A misspelt name stops the game with an error naming the
# line. Distances are Unreal units (uu; a commando is 168 uu tall), times
# are seconds, angles degrees.
#
# Where a value comes from:
#   "game"  = the original's class defaults (Properties.BattleDroidTM and
#             its parents BattleDroid, Pawn; BattleDroidBot, CTBot;
#             StateBattleDroidAttack, StateAbstractAttack;
#             BattleDroidBlasterTM). See docs/RESEARCH.md "Battle droids".
#   "guess" = the original decides this in its compiled engine, which we
#             don't read. Our own choice; tune freely.
#
# Every enemy type has a file like this one in data/enemies/. A file only
# needs the lines that differ from the battle droid: anything left out
# takes the battle droid's value. Add a new file to add a new enemy type.

[type]
id = "battle_droid"       # this file's name
name = "battle droid"     # for the log
classes = ["BattleDroid*"] # the game's classes a map's spawner may make; * matches any ending (BattleDroid, BattleDroidTM, ...)
body = "droid"            # "droid" or "organic": EMP stuns droids, flash grenades blind organics

[movement]
ground_speed = 375        # game: BattleDroid GroundSpeed
accel_rate = 1000         # game: BattleDroid AccelRate
walk_speed_ratio = 0.52   # game: BattleDroid WalkSpeedRatio
collision_radius = 35     # game: BattleDroid CollisionRadius
collision_height = 80     # game: BattleDroid CollisionHeight (half-height)
crouch_radius = 35        # game: BattleDroid CrouchRadius
crouch_height = 50        # game: BattleDroid CrouchHeight
base_eye_height = 60      # game: BattleDroid BaseEyeHeight
side_speed_ratio = 0.8    # game: Pawn SideSpeedRatio
jump_z = 0                # droids don't jump

[senses]
sight_radius = 5000       # game: BattleDroidTM SightRadius
peripheral_vision = 0.2   # game: Pawn PeripheralVision (sees things within about 78 degrees of straight ahead)
auto_detect_radius = 200  # game: Pawn AutoDetectRadius (notices you this close whichever way it faces)
enemy_memory_time = 15    # game: CTBot EnemyMemoryTime (forgets you after this long unseen)
decision_interval = 0.5   # game: CTBot DecisionInterval
reaction_time = 0.5       # guess: delay between first seeing you and starting to shoot
turn_rate = 110           # game: Pawn RotationRate yaw 20000 per second = 110 degrees/s
hearing_radius = 2500     # guess: hears shots this far away and turns to fight (the original's hearing is in its engine)

[combat]
health = 100              # game: BattleDroidTM MaxHealth (Pawn sets Health = MaxHealth at spawn)
accuracy = 0.4            # game: BattleDroidTM Accuracy (0 = wild, 1 = perfect)
max_aim_error = 10        # guess: aim error in degrees at accuracy 0; actual error is (1 - accuracy) x this
weapon = "e5_blaster_tm"  # the weapons thread's data file (data/weapons/e5_blaster_tm.toml)
burst_count = 3           # game: BattleDroidBot BurstCount
shot_delay = 0.1          # game: BattleDroidBlasterTM ShotDelay (seconds between shots in a burst)
burst_pause_min = 1.0     # guess: rest between bursts, shortest
burst_pause_max = 2.0     # guess: rest between bursts, longest
weapon_range = 7000       # game: Weapon ValidRange max
max_aim_yaw = 60          # game: BattleDroid MaxAimYaw (can shoot this far off its facing)
ready_distance = 800      # game: StateAbstractAttack ReadyDistance (distance it likes to keep)
safe_distance = 1200      # game: StateAbstractAttack SafeDistance (farthest it likes to be)
move_interval = 400       # guess: how far it advances at a time (StateBattleDroidAttack MoveIntervalDist; value not stored in the scripts)
max_maneuver_time = 10    # game: StateBattleDroidAttack MaxManuverTime
cover_boredom_time = 15   # game: CTBot CoverBoredomTime (looks for new cover after this long)
cover_search_radius = 1500 # guess: how far it will go to reach cover
lost_sight_reposition = 2 # guess: seconds without a clear shot before a stationary droid moves
uses_cover = true         # guess: looks for cover when shot in the open
drops = "e5_blaster_pickup" # placeholder: the weapon file it leaves when it falls ("" for none)
damage_table = "DV_DroidsBattleDroidDamage" # game: BattleDroid DamageVariance (data/combat/damage_types.toml)

[grenades]
# Grenades it throws. The original's battle droids carry none, so grenade
# is empty. A file that sets grenade (a file in data/grenades/) and count
# makes that enemy throw. The rules for when are ours (the original's are
# in its compiled engine); the numbers are the original's settings.
grenade = ""              # game: battle droids carry no grenade (RequiredEquipment)
count = 0                 # how many it carries
probability = 0.3         # game: CTBot GrenadeProbability (chance at each decision while it may throw)
min_time = 10             # game: CTBot MinGrenadeTime (seconds between one enemy's throws)
min_range = 600           # game: ThermalDetonator ValidRange min (won't throw at anyone closer)
max_range = 2500          # game: ThermalDetonator ValidRange max
seen_within = 3           # guess: only throws at an enemy it saw this recently
throw_time = 1.0          # guess: seconds the throw takes (no shooting meanwhile)
# The arc is aimed with the grenade file's speed, gravity and radius;
# these three are used only if that file can't be read.
speed = 2200              # game: GrenadeProj Speed
gravity = 1100            # game: LevelInfo gravity
radius = 600              # game: ThermalDetonatorProjDefaults DamageRadius (no throw if a friend is this near the landing spot)

[spawning]
# In the game the level's scripts switch spawners on, as in the original.
# Only the tools that run without scripts (rc_droidsim, rc_droidview) start
# spawners themselves: by their walk-in Triggers, or, for spawners with
# none, when the player comes this close.
activate_unscripted_within = 3000
max_alive_total = 12      # guess: cap on droids alive at once, for speed on phones

[sound]
# What the droid says. Names are groups (SoundMultiple) in
# GameData/Sounds/character_voice.uax; each time one line from the group
# plays. List a package's sounds with
# `rc_probe --sounds "<game>\GameData\Sounds\<package>.uax"`.
#
# game: BattleDroid AudioTable = BattleDroidAudio (System/ctaudio.u), a table of one
# group per event (engine.u EPawnAudioEvent). "hurt_<kind>" and
# "death_<kind>" are used when that kind of damage did it (blaster,
# explosion, sonic, electrical, fire, melee, fall, other); otherwise
# "hurt" and "death". Only the kinds the game's table has are listed.
# Its other lines (LargeArms, Quiet, HeardSomething, SearchAbort,
# SeeGrenade, KilledExcited, Retreat, ...) aren't hooked up yet.
package = "character_voice"
spotted = ["BD1_SpottedEnemy"]       # game: PAE_SpottedEnemy
hurt = ["BD1_HurtSmallArms"]         # game: PAE_HurtSmallArms
death = ["BD1_DieSmallArms"]         # game: PAE_DieSmallArms
hurt_explosion = ["BD1_HurtExplosion"]
death_explosion = ["BD1_DieExplosion"]
hurt_electrical = ["BD1_HurtElectricity"]
death_electrical = ["BD1_DieElectricity"]
hurt_melee = ["BD1_HurtMelee"]
hurt_fall = ["BD1_HurtFall"]
death_fall = ["BD1_DieFall"]
hurt_interval = 2.0                    # our choice: seconds between hurt lines from one character

[look]
# The animated mesh and which of its animations to play. Names are as
# stored in the game's package (list them with
# `rc_character --package <file> --set BattleDroidSet --list`).
package = "GameData/Animations/droid.ukx"
mesh = "BattleDroid"
idle = "ActionBreathe"
walk = "WalkForward"
run = "RunForward"
walk_back = "WalkBackward"
step_left = "StepLeft"
step_right = "StepRight"
fire = "Fire"
crouch = "CrouchBreathe"
crouch_fire = "CrouchFire"
death = "Death"
throw = ""                # throwing a grenade; empty: battle droids don't
ambient = 0.5             # guess: light the droid always gets (0 to 1); the original uses each zone's ambient light, which we don't read yet
