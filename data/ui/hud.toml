# --- What was just picked up, above the middle ------------------------------
# The original's pickup message (engine.u PickupMessagePlus, a LocalMessage):
# centred across the screen, 35% of the way down (YPos 0.35, DrawPivot
# middle), white, one at a time (a new one replaces the last), shown for
# 3 seconds and fading (LifeTime 3, bFadeMessage). The words are each box's
# PickupMessage ("DC-17m Blaster Clips", "Thermal Detonators"), read from
# the game. OUR CHOICE: the size, and fading over the last second (the
# original draws this in native code we can't read). How long it stays and
# how long it fades are in [pickup_message] below.
# 35% down a 480-unit screen is 168; the 13-unit line is centred on it.

[pickup_message]
seconds = 3.0   # on screen, fading included (game: LifeTime 3)
fade = 1.0      # the last second fades out (our choice)

[[element]]
group = "pickup"
anchor = "centre"
at = [-160, -78.5]
size = [320, 13]
when = "pickup"
text = "{pickup}"
align = "centre"
colour = [255, 255, 255, 255]
fade = "pickup"

# --- The use prompt, near the top ---------------------------------------------
# "PRESS AND HOLD 'F' TO HEAL" while you aim at a bacta dispenser you can
# use (the dispenser's ActivatePromptText, read from the game). The original
# draws it in native code; place, size and colour were matched to the
# user's screenshots of the original (1600x1200): two centred lines whose
# middles are 190 and 247 pixels down. Colour: the HUD's own
# DefaultTextColor (engine.u HUD).
[[element]]
group = "prompt"
anchor = "centre"
at = [-160, -173]
size = [320, 18]
when = "prompt"
text = "{prompt1}"
align = "centre"
colour = [198, 232, 255, 255]

[[element]]
group = "prompt"
anchor = "centre"
at = [-160, -150]
size = [320, 18]
when = "prompt"
text = "{prompt2}"
align = "centre"
colour = [198, 232, 255, 255]
