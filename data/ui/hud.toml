# Which of the original game's HUD pictures the HUD uses. The pictures are
# read from the player's install at run time; nothing from the game is here.
# Where each picture goes is read from the original's engine code where
# the notes say so, otherwise our own choice.
#
# The crosshair, read from the original 2026-11-11: each weapon class's
# `Reticle` (ctinventory.u class defaults; the "...PC" pictures are not
# used by any weapon), drawn by the helmet (Engine.dll UHelmet::DrawHelmet)
# at the screen's centre at the picture's own size on its 600-line HUD (so
# 0.8 of ours), tinted by what it is over (the target type):
#   normally (200, 240, 255) at opacity 110,
#   over a friend (130, 255, 130) at 220,
#   over an enemy (255, 130, 130) at 220.
# If a picture can't be read, the placeholder crosshair stays and
# logs/rc_game.log says why ("original hud: crosshair ...").
[crosshair]
enabled = true
default = "HUDTextures.Reticles.HUD_WeaponDefault"     # DC17mBlaster
scale = 0.8
colour = [200, 240, 255, 110]
friend_colour = [130, 255, 130, 220]
enemy_colour = [255, 130, 130, 220]

# Weapon name, as in its file in data/weapons/, to its class's reticle.
[crosshair.weapons]
"DC-15s Pistol" = "HUDTextures.Reticles.HUD_WeaponPistol"                 # DC15s
"DC-17m Sniper" = "HUDTextures.Reticles.HUD_WeaponSniper"                 # DC17mSniper
"DC-17m Anti-Armour" = "HUDTextures.Reticles.HUD_WeaponAntiArmor"         # DC17mAntiArmor
"ACP Array Gun" = "HUDTextures.Reticles.HUD_WeaponTranShotgun"            # Shotgun
"ACP Repeater" = "HUDTextures.Reticles.HUD_WeaponTranSMG"                 # SMG
"LS-150 Heavy ACP Repeater Gun" = "HUDTextures.Reticles.HUD_WeaponTranSMG" # TrandoshanRifle
"LJ-50 Concussion Rifle" = "HUDTextures.Reticles.HUD_WeaponTranConcRifle" # ConcussionRifle
"Wookiee Bowcaster" = "HUDTextures.Reticles.HUD_WeaponWookBowcaster"      # Bowcaster
"Wookiee Homing Rocket Launcher" = "HUDTextures.Reticles.HUD_WeaponWookHomingDet" # RocketLauncher
"Elite Beam" = "HUDTextures.Reticles.HUD_WeaponGeoElite"                  # EliteBeam

# The use panel round the crosshair, while you stand at something you use by
# holding Use (a bacta dispenser). The pictures are the original's; when
# the original shows which, and how the outer part moves, is native code,
# so that part is our reading: `ready` shows at the dispenser, `inside`
# and `outside` while you heal, the outer part turning `turn` degrees
# (clockwise) from empty to full health. Remove this part to turn it off.
[use_panel]
# The use panel at the crosshair while you aim at a bacta dispenser, in
# place of the crosshair. All pictures are the game's own. How the original
# draws them was read from its engine code (Engine.dll, the helmet HUD's
# DrawTimerRing and the part of DrawHelmet that calls it for a "panel"
# target), 2026-11-11, and is written here as numbers:
#
# The ring (HUD_EventTimer) is centred on the screen at its picture's own
# size on the original's 600-line HUD (so 0.8 on our 480 lines). It is cut
# into a 4 by 4 grid of pieces: the whole ring is drawn faint first, then
# the pieces lit so far on top, one more step per twelfth of the value,
# from just left of the top, down the left, along the bottom and up the
# right; the piece just right of the top only lights at full. For a bacta
# dispenser the value is your health. At full health only the icon shows.
ring = "HUDTextures.Reticles.HUD_EventTimer"
ring_scale = 0.8
ring_colour = [200, 240, 255]
ring_alpha = 255
ring_alpha_unlit = 92
# The icon: the target's HUDIconX/HUDIconY square (BactaDispenser: 1, 7) of
# the helmet's LargeVisorIcons sheet, 40-pixel squares counted from the
# bottom right of a 3 by 10 grid, drawn 40x40 at the screen centre. Its
# colour follows the same value: red-pink at 0, green at 1, mixed in a
# straight line between.
icon_sheet = "HUDTextures.Icons.LargeVisorIcons"
icon_cell = 40
icon_grid = [3, 10]
icon = [1, 7]
icon_scale = 0.8
icon_colour_empty = [255, 140, 180]
icon_colour_full = [140, 255, 180]
icon_alpha = 240
# The prompt (the [[element]]s with {prompt1} and {prompt2} below) breaks
# onto a second line after about this many letters, as in the original.
prompt_wrap = 21

# ---------------------------------------------------------------------------
# The rest of the HUD: shield, health, ammunition, grenades, squad and
# messages, from the original's pictures (HUDTextures.Icons.CloneIcons and
# CloneVisorIcons, sheets of many small pictures) and fonts (OrbitFonts).
#
# The original places these in native code we can't read, so the places
# below were matched by eye to a screenshot of the original (2026-10-30):
# squad numbers over three order panels at the bottom left, two green
# stepped meters either side of the bottom middle, the grenade panel and
# count at the bottom right. OUR CHOICE: which meter is which (left =
# shield with health as the ticks beside it, right = magazine), the ammo
# numbers, the messages, and the colours. Change them freely.
#
# Units: the HUD is designed on a 640 x 480 area. One unit is as many
# pixels as fit that area on the screen (the height / 480 on a wide
# screen, the width / 640 on a tall one). Each element is pinned to a
# corner or edge (`anchor`) and `at` moves its top-left corner from there
# (x right, y down; use negative numbers from the right or bottom). Its
# `size` is width and height. Texts are cut short with "..." to fit their
# width, so they can't run into anything else.
#
# Groups (`group`) must not overlap each other; `cargo test -p rc_menus`
# checks that at 18 screen shapes, from 4:3 and flip phones on their side
# to 32:9 (phones held upright are not supported).
#
# Texts: {weapon} {clip} {reserve} {grenade} {grenades} {message1}
# (newest) {message2} {message3} {pickup} {prompt1} {prompt2} (the use
# prompt's two lines) {subtitle} {objective}; for squad rows {number} {name}
# {order}.
# Conditions (`when`, `alert_when`, "!" in front means "not"): weapon,
# clip, reserve, grenade, shield_low, health_low, health_full, squad_down, pickup,
# prompt, subtitle, objective.
# Bars (`fill`): shield, health, clip, squad_health.
# Fading (`fade`, 1 shown to 0 gone): pickup, prompt, subtitle, objective.
# Sliding (`scroll`, in picture widths, the picture repeating): compass.
# Colours by a text (`colour_by` with `colours`): {health_level} and
# {squad_health_level} are 0 to 3, the original's `CalcHealthLevel`.
# Blinking (`blink`): health, squad, grenade, shields. While a level
# script blinks that part of the HUD (the original's BlinkHUDHealth and so
# on, which teach the player the HUD in the first levels), the element's
# opacity follows the original's blink (Engine.dll `UHelmet::DrawHUD`):
# health blinks the health-coloured meter parts, squad the squad panels,
# grenade the grenade panel, picture and count, as the original does.
# Texts can also name their `font` (one of the fonts below, scaled to the
# line height), `wrap` onto more lines, and be drawn through the helmet's
# glass (`glass = true`), as the original draws its HUD.

[layout]
enabled = true
# Bigger or smaller: 1 = as designed, down to 0.5.
scale = 1.0
fonts = [
    "OrbitFonts.OrbitBold8",
    "OrbitFonts.OrbitBold12",
    "OrbitFonts.OrbitBold15",
    "OrbitFonts.OrbitBold18",
    "OrbitFonts.OrbitBold24",
]
# Seconds the advisor's words and the objective take to fade in (the
# original helmet's PromptFadeInTime, 0.5 in engine.u).
text_fade_in = 0.5

