# Which of the original game's HUD pictures the HUD uses. The pictures are
# read from the player's install at run time; nothing from the game is here.
# The original draws its HUD in native code, so where each picture goes is
# our own choice.
#
# Checked 2026-10-29 against the install: HUDTextures.utx has each reticle
# twice, a console one and a smaller "...PC" one; we use the PC ones. If a
# picture can't be read, the placeholder crosshair stays and
# logs/rc_game.log says why ("original hud: crosshair ..."). See them all
# with:
#   rc_probe --export-textures "<game folder>\GameData\Textures\HUDTextures.utx"

[crosshair]
enabled = true
default = "HUDTextures.Reticles.HUD_WeaponDefaultPC"
# 1 = one picture pixel per line of a 480-line screen (a guess).
scale = 1.0

# Weapon name, as in its file in data/weapons/, to its reticle.
[crosshair.weapons]
"DC-15s Pistol" = "HUDTextures.Reticles.HUD_WeaponPistolPC"

# The use panel round the crosshair, while you stand at something you use by
# holding Use (a bacta dispenser). The pictures are the original's; when
# the original shows which, and how the outer part moves, is native code,
# so that part is our reading: `ready` shows at the dispenser, `inside`
# and `outside` while you heal, the outer part turning `turn` degrees
# (clockwise) from empty to full health. Remove this part to turn it off.
[use_panel]
# The use panel at the crosshair while you aim at a bacta dispenser, in
# place of the crosshair. All pictures are the game's own; the original
# draws them in native code, so sizes and colours were matched to the
# user's screenshots and video of the original (2026-11-10, 1600x1200):
# the ring's outer edge is 206 pixels across there, the icon's circle 74.
#
# The ring (HUD_EventTimer) shows your health while the dispenser can heal
# you, filling a quarter at a time from the top round to the left; the
# part still to fill shows at ring_unfilled strength. At full health (or
# while the dispenser recharges) only the icon shows.
ring = "HUDTextures.Reticles.HUD_EventTimer"
ring_scale = 0.8
# The HUD's own DefaultTextColor (engine.u HUD).
ring_colour = [198, 232, 255]
ring_unfilled = 0.4
# The dispenser's icon: square icon (counted from the bottom right, the
# game's BactaDispenser HUDIconX 1, HUDIconY 7) of the CloneVisorIcons
# sheet, whose squares are icon_cell pixels. Paler before use, greener in
# use.
icon_sheet = "HUDTextures.Icons.CloneVisorIcons"
icon_cell = 27
icon = [1, 7]
icon_scale = 1.23
icon_colour = [170, 205, 172]
icon_colour_working = [138, 240, 176]
# The prompt (the [[element]]s with {prompt1} and {prompt2} below) breaks
# onto a second line after about this many letters, as in the original.
prompt_wrap = 21

# ---------------------------------------------------------------------------
# The rest of the HUD: shield, health, ammunition, grenades, squad and
# messages, from the original's pictures (HUDTextures.Icons.CloneIcons and
# CloneVisorIcons, sheets of many small pictures) and fonts (OrbitFonts).
#
# The original places these in native code we can't read, so the places
# below were matched by eye to a screenshot of the original (2026-10-30):
# squad numbers over three order panels at the bottom left, two green
# stepped meters either side of the bottom middle, the grenade panel and
# count at the bottom right. OUR CHOICE: which meter is which (left =
# shield with health as the ticks beside it, right = magazine), the ammo
# numbers, the messages, and the colours. Change them freely.
#
# Units: the HUD is designed on a 640 x 480 area. One unit is as many
# pixels as fit that area on the screen (the height / 480 on a wide
# screen, the width / 640 on a tall one). Each element is pinned to a
# corner or edge (`anchor`) and `at` moves its top-left corner from there
# (x right, y down; use negative numbers from the right or bottom). Its
# `size` is width and height. Texts are cut short with "..." to fit their
# width, so they can't run into anything else.
#
# Groups (`group`) must not overlap each other; `cargo test -p rc_menus`
# checks that at 18 screen shapes, from 4:3 and flip phones on their side
# to 32:9 (phones held upright are not supported).
#
# Texts: {weapon} {clip} {reserve} {grenade} {grenades} {message1}
# (newest) {message2} {message3} {pickup} {prompt1} {prompt2} (the use
# prompt's two lines); for squad rows {number} {name}
# {order}.
# Conditions (`when`, `alert_when`, "!" in front means "not"): weapon,
# clip, reserve, grenade, shield_low, health_low, health_full, squad_down, pickup,
# prompt.
# Bars (`fill`): shield, health, clip, squad_health.
# Fading (`fade`, 1 shown to 0 gone): pickup.

[layout]
enabled = true
# Bigger or smaller: 1 = as designed, down to 0.5.
scale = 1.0
fonts = [
    "OrbitFonts.OrbitBold8",
    "OrbitFonts.OrbitBold12",
    "OrbitFonts.OrbitBold15",
    "OrbitFonts.OrbitBold18",
    "OrbitFonts.OrbitBold24",
]

# --- Squad, bottom left: each squad mate's number over a panel showing
# what they're doing ------------------------------------------------------

[[element]]
group = "squad"
anchor = "bottom_left"
at = [64, -134]
size = [34, 14]
repeat_squad = [37, 0]
text = "{number}"
align = "centre"
colour = [205, 220, 225, 255]
alert_when = "squad_down"
alert_colour = [255, 80, 60, 255]

[[element]]
group = "squad"
anchor = "bottom_left"
at = [64, -112]
size = [34, 31]
repeat_squad = [37, 0]
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [147, 399, 191, 442]
colour = [150, 215, 150, 255]
alert_when = "squad_down"
alert_colour = [255, 80, 60, 255]

# The order icon inside the panel, by what the squad mate is doing.
[[element]]
group = "squad"
anchor = "bottom_left"
at = [72, -105]
size = [18, 17]
repeat_squad = [37, 0]
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [202, 431, 228, 457]
choose_by = "{order}"
choices = { "FORM UP" = [202, 377, 228, 403], "SEARCH AND DESTROY" = [202, 350, 228, 376], "SECURE AREA" = [202, 404, 228, 430], "HOLD" = [202, 323, 228, 349], "DOWN" = [202, 458, 228, 484] }
colour = [110, 235, 95, 255]
alert_when = "squad_down"
alert_colour = [255, 80, 60, 255]

# --- Health: the stepped meters either side of the middle ----------------
# From the user's video of the original healing at a bacta dispenser
# (2026-11-10): both stepped meters show health, mirrored, lit from the
# bottom up (8 of 12 steps lit when hurt, all 12 at full); yellow while
# hurt, green at full health. The pictures are the game's
# (CloneVisorIcons); the original tints them in engine code, so the
# colours were measured from the video (yellow 214,208,98; green
# 72,212,68). OUR GUESS, not in the video: red when health is low.
# Shield: the column of ticks beside the left meter (our guess).

[[element]]
group = "vitals"
anchor = "bottom"
at = [-172, -80]
size = [50, 39]
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [181, 36, 239, 94]
colour = [110, 160, 105, 200]

[[element]]
group = "vitals"
anchor = "bottom"
at = [-172, -80]
size = [50, 39]
when = "health_full"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [181, 180, 241, 237]
fill = "health"
fill_toward = "down"
colour = [72, 212, 68, 255]

[[element]]
group = "vitals"
anchor = "bottom"
at = [-172, -80]
size = [50, 39]
when = "!health_full"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [181, 180, 241, 237]
fill = "health"
fill_toward = "down"
colour = [214, 208, 98, 255]
alert_when = "health_low"
alert_colour = [255, 80, 60, 255]

[[element]]
group = "vitals"
anchor = "bottom"
at = [-120, -80]
size = [9, 39]
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [233, 38, 251, 94]
fill = "shield"
fill_toward = "down"
colour = [110, 235, 95, 255]
alert_when = "shield_low"
alert_colour = [255, 210, 90, 255]

# The same health meter, mirrored, right of the middle.

[[element]]
group = "ammo"
anchor = "bottom"
at = [118, -80]
size = [50, 39]
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [181, 36, 239, 94]
mirror = true
colour = [110, 160, 105, 200]

[[element]]
group = "ammo"
anchor = "bottom"
at = [118, -80]
size = [50, 39]
when = "health_full"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [181, 180, 241, 237]
mirror = true
fill = "health"
fill_toward = "down"
colour = [72, 212, 68, 255]

[[element]]
group = "ammo"
anchor = "bottom"
at = [118, -80]
size = [50, 39]
when = "!health_full"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [181, 180, 241, 237]
mirror = true
fill = "health"
fill_toward = "down"
colour = [214, 208, 98, 255]
alert_when = "health_low"
alert_colour = [255, 80, 60, 255]

# Shots in the magazine, and spare ammo, over the meter.
[[element]]
group = "ammo"
anchor = "bottom"
at = [118, -100]
size = [28, 14]
