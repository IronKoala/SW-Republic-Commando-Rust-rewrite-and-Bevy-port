# --- The advisor's words and the current objective, near the top -----------
# Both read from the original's engine code (Engine.dll, the helmet HUD's
# DrawTextInfo, DrawSubtitleText and DrawCurrentObjectiveText), 2026-11-11.
# The original draws them on an 800 x 600 HUD; here 1 of its units is 0.8
# of ours. Its text box starts 218 across and 45 down and is 364 wide
# (so it is centred: 400 is the middle), the font is OrbitFonts.OrbitBold15
# (27 lines tall), and the HUD is then drawn through the helmet's glass,
# which moves it lower and curves it (`glass = true`).
#
# The words (who speaks and what, from the game's subtitles files): left
# aligned, the font at 0.8 of its size (27 x 0.8 = 21.6 of 600, 17.28 of
# ours), broken onto more lines to fit the box, colour (200, 200, 64) at
# 220 of 255 opacity, fading in over PromptFadeInTime ([layout]
# text_fade_in). While they show, nothing else in the box does.
[[element]]
group = "messages"
anchor = "top"
at = [-145.6, 36]
size = [291.2, 17.28]
when = "subtitle"
text = "{subtitle}"
font = "OrbitFonts.OrbitBold15"
wrap = true
glass = true
blend = "alpha"
colour = [200, 200, 64, 220]
fade = "subtitle"

# The current objective (the map's MissionObjectives list: the first one
# not yet done, in capitals): centred in the same box, the font at full
# size (21.6 of ours), colour (164, 200, 208) at 220 opacity, fading in
# when it changes. Shown when nothing else is in the box.
[[element]]
group = "messages"
anchor = "top"
at = [-145.6, 36]
size = [291.2, 21.6]
when = "objective"
text = "{objective}"
align = "centre"
font = "OrbitFonts.OrbitBold15"
wrap = true
glass = true
blend = "alpha"
colour = [164, 200, 208, 220]
fade = "objective"

# --- What was just picked up, above the middle ------------------------------
# The original's pickup message (engine.u PickupMessagePlus, a LocalMessage):
# centred across the screen, 35% of the way down (YPos 0.35, DrawPivot
# middle), white, one at a time (a new one replaces the last), shown for
# 3 seconds and fading (LifeTime 3, bFadeMessage). The words are each box's
# PickupMessage ("DC-17m Blaster Clips", "Thermal Detonators"), read from
# the game. OUR CHOICE: the size, and fading over the last second (the
# original draws this in native code we can't read). How long it stays and
# how long it fades are in [pickup_message] below.
# 35% down a 480-unit screen is 168; the 13-unit line is centred on it.

[pickup_message]
seconds = 3.0   # on screen, fading included (game: LifeTime 3)
fade = 1.0      # the last second fades out (our choice)

[[element]]
group = "pickup"
anchor = "centre"
at = [-160, -78.5]
size = [320, 13]
when = "pickup"
text = "{pickup}"
align = "centre"
colour = [255, 255, 255, 255]
fade = "pickup"

# --- The use prompt, near the top ---------------------------------------------
# "PRESS AND HOLD 'F' TO HEAL" while you aim at a bacta dispenser you can
# use (the dispenser's ActivatePromptText, read from the game). The original
# draws it in native code; place and size were matched to the user's
# screenshots of the original (1600x1200): two centred lines whose middles
# are 190 and 247 pixels down. Colour read from Engine.dll (below); the
# original also fades it in over the helmet's PromptFadeInTime (0.5 s),
# which we don't do yet.
[[element]]
group = "prompt"
anchor = "centre"
at = [-160, -173]
size = [320, 18]
when = "prompt"
text = "{prompt1}"
align = "centre"
# The original's activate-prompt colour, read from Engine.dll
# (DrawActivateText): (164, 200, 208), fading in to 220 opacity.
colour = [164, 200, 208, 220]

[[element]]
group = "prompt"
anchor = "centre"
at = [-160, -150]
size = [320, 18]
when = "prompt"
text = "{prompt2}"
align = "centre"
colour = [164, 200, 208, 220]
