# Which of the original game's HUD pictures the HUD uses. The pictures are
# read from the player's install at run time; nothing from the game is here.
# The original draws its HUD in native code, so where each picture goes is
# our own choice.
#
# Checked 2026-10-29 against the install: HUDTextures.utx has each reticle
# twice, a console one and a smaller "...PC" one; we use the PC ones. If a
# picture can't be read, the placeholder crosshair stays and
# logs/rc_game.log says why ("original hud: crosshair ..."). See them all
# with:
#   rc_probe --export-textures "<game folder>\GameData\Textures\HUDTextures.utx"

[crosshair]
enabled = true
default = "HUDTextures.Reticles.HUD_WeaponDefaultPC"
# 1 = one picture pixel per line of a 480-line screen (a guess).
scale = 1.0

# Weapon name, as in its file in data/weapons/, to its reticle.
[crosshair.weapons]
"DC-15s Pistol" = "HUDTextures.Reticles.HUD_WeaponPistolPC"

# ---------------------------------------------------------------------------
# The rest of the HUD: shield, health, ammunition, grenades, squad and
# messages, from the original's pictures (HUDTextures.Icons.CloneIcons and
# CloneVisorIcons, sheets of many small pictures) and fonts (OrbitFonts).
#
# OUR CHOICE: the original places these in native code we can't read, so
# the places below are ours, matched by eye. Change them freely.
#
# Units: the HUD is designed on a 640 x 480 area. One unit is as many
# pixels as fit that area on the screen (the height / 480 on a wide
# screen, the width / 640 on a tall one). Each element is pinned to a
# corner or edge (`anchor`) and `at` moves its top-left corner from there
# (x right, y down; use negative numbers from the right or bottom). Its
# `size` is width and height. Texts are cut short with "..." to fit their
# width, so they can't run into anything else.
#
# Groups (`group`) must not overlap each other; `cargo test -p rc_menus`
# checks that at 22 screen shapes, from phones held upright to 32:9.
#
# Texts: {weapon} {clip} {reserve} {grenade} {grenades} {message1}
# (newest) {message2} {message3}; for squad rows {number} {name} {order}.
# Conditions (`when`, `alert_when`, "!" in front means "not"): weapon,
# clip, reserve, grenade, shield_low, health_low, squad_down.
# Bars (`fill`): shield, health, clip, squad_health.

[layout]
enabled = true
# Bigger or smaller: 1 = as designed, down to 0.5.
scale = 1.0
fonts = [
    "OrbitFonts.OrbitBold8",
    "OrbitFonts.OrbitBold12",
    "OrbitFonts.OrbitBold15",
    "OrbitFonts.OrbitBold18",
    "OrbitFonts.OrbitBold24",
]

# --- Shield and health, bottom left ---------------------------------------
# The long bar is the shield, the short one health: a dim empty bar with
# the bright full one over it, cut to what is left.

[[element]]
group = "vitals"
anchor = "bottom_left"
at = [16, -62]
size = [180, 11]
picture = "HUDTextures.Icons.CloneIcons"
part = [6, 3, 430, 25]

[[element]]
group = "vitals"
anchor = "bottom_left"
at = [16, -62]
size = [180, 11]
picture = "HUDTextures.Icons.CloneIcons"
part = [0, 26, 435, 54]
fill = "shield"
alert_when = "shield_low"
alert_colour = [255, 210, 90, 255]

[[element]]
group = "vitals"
anchor = "bottom_left"
at = [16, -44]
size = [112, 12]
picture = "HUDTextures.Icons.CloneIcons"
part = [4, 59, 262, 83]

[[element]]
group = "vitals"
anchor = "bottom_left"
at = [16, -44]
size = [112, 12]
picture = "HUDTextures.Icons.CloneIcons"
part = [0, 91, 268, 122]
fill = "health"
alert_when = "health_low"
alert_colour = [255, 90, 60, 255]

# --- Squad, top left: one row per squad mate --------------------------------

[[element]]
group = "squad"
anchor = "top_left"
at = [16, 16]
size = [18, 21]
repeat_squad = [0, 30]
picture = "HUDTextures.Icons.CloneIcons"
part = [272, 56, 316, 108]
alert_when = "squad_down"
alert_colour = [255, 90, 60, 255]

[[element]]
group = "squad"
anchor = "top_left"
at = [40, 16]
size = [84, 11]
repeat_squad = [0, 30]
text = "{number} {name}"
colour = [190, 235, 245, 255]
alert_when = "squad_down"
alert_colour = [255, 90, 60, 255]

[[element]]
group = "squad"
anchor = "top_left"
at = [40, 28]
size = [84, 8]
repeat_squad = [0, 30]
text = "{order}"
colour = [140, 190, 200, 255]
alert_when = "squad_down"
alert_colour = [255, 90, 60, 255]

[[element]]
group = "squad"
anchor = "top_left"
at = [128, 19]
size = [44, 5]
repeat_squad = [0, 30]
picture = "HUDTextures.Icons.CloneIcons"
part = [4, 59, 262, 83]

[[element]]
group = "squad"
anchor = "top_left"
at = [128, 19]
size = [44, 5]
repeat_squad = [0, 30]
picture = "HUDTextures.Icons.CloneIcons"
part = [0, 91, 268, 122]
fill = "squad_health"
alert_when = "squad_down"
alert_colour = [255, 90, 60, 255]

# --- Weapon, ammunition and grenades, bottom right --------------------------

[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-166, -104]
size = [150, 10]
when = "weapon"
text = "{weapon}"
align = "right"
colour = [140, 190, 200, 255]

# Shots in the magazine, big, with the spare ammo beside it.
[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-166, -91]
size = [98, 24]
when = "weapon"
text = "{clip}"
align = "right"
colour = [190, 235, 245, 255]

[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-64, -81]
size = [48, 13]
when = "reserve"
text = "{reserve}"
align = "right"
colour = [140, 190, 200, 255]

# The magazine bar: a frame with a strip of ticks inside, cut to the
# shots left.
[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-116, -62]
size = [100, 18]
when = "clip"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [57, 466, 191, 490]

[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-107, -57]
size = [86, 10]
when = "clip"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [69, 491, 184, 505]
fill = "clip"

# The selected grenade's picture, and its name and count.
[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-166, -36]
size = [13, 19]
when = "grenade"
picture = "HUDTextures.Icons.CloneVisorIcons"
part = [152, 242, 170, 268]
choose_by = "{grenade}"
choices = { "THERMAL DETONATOR" = [152, 242, 170, 268], "SONIC DETONATOR" = [152, 269, 170, 295], "EC DETONATOR" = [152, 296, 170, 322], "FLASH DETONATOR" = [148, 323, 174, 349] }

[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-150, -32]
size = [106, 11]
when = "grenade"
text = "{grenade}"
align = "right"
colour = [140, 190, 200, 255]

[[element]]
group = "ammo"
anchor = "bottom_right"
at = [-40, -32]
size = [24, 11]
when = "grenade"
text = "x{grenades}"
align = "right"
colour = [190, 235, 245, 255]

