# Which of the original game's menus draws each page, and what its buttons
# do. The menus themselves (pictures, text, positions, sounds) are read
# from the player's install at run time; nothing from the game is here.
#
# A page uses its original menu only when every widget on it is a kind we
# can draw and every button it shows has a command below. Otherwise the
# placeholder page is used, and logs/rc_game.log says why
# ("original menus: page paused kept the placeholder: ...").
#
# Button names are the original's function names (its OnSelect), any case.
# Commands:
#   resume        close the pause menu
#   restart       load the current level again
#   open:<page>   open another page below (or its placeholder)
#   back          go back a page
#   quit_to_menu  leave the level for the main menu
#   quit_game     ask "are you sure?", then quit
#   play:<map>    start a map
#   unavailable   greyed out, can't be chosen (not built yet)
#   switch:<page> show another page in this one's place (the options
#                 pages' GAME, SOUND, GRAPHICS and CONTROLS tabs)
#   option_left, option_right   the arrows beside a chooser
#   restore_defaults            put the page's settings back to defaults
#   rebind        choose a new key for the row's action (controls page)
#   prev_set, next_set          flip the controls page's sets of rows
#
# Choosers (the original's MenuButtonEnum rows, such as "Options[3]") show
# a setting: [pages.<page>.choosers] names it, or says "unavailable" (the
# whole row is greyed out, as the original greys out options it can't
# offer). The settings are in rc_game/src/option_settings.rs.
#
# Key buttons on the controls page ([pages.<page>.keys]) name the action
# they change, as in data/input/bindings.toml, or "unavailable".
#
# [pages.<page>.extra_buttons.<Name>] adds a button the original doesn't
# have, copied from one of the page's own buttons and moved down. Its text
# must say it's this port's addition.
#
# Checked 2026-10-29 with `rc_probe --pages` against the install: these are
# the original's function names. `rc_probe --pages` lists every menu's
# buttons and says which pages would use their original menu.

[pages.paused]
class = "XInterfaceCTMenus.CTPausePCMenu"
over_game = true
back = "resume"

# In the original's order. Saving, loading and hints aren't built yet.
[pages.paused.buttons]
LoadLastSaveSelected = "unavailable"
QuickSaveSelected = "unavailable"
QuickLoadSelected = "unavailable"
ResumeGameSelected = "resume"
RestartMissionSelected = "restart"
SaveGameSelected = "unavailable"
LoadGameSelected = "unavailable"
OptionsSelected = "open:options"
EnableHintsSelected = "unavailable"
EndMissionSelected = "quit_to_menu"
QuitSelected = "quit_game"

# The campaign menu (checked): its planets, level list and scroll bar are
# widget kinds the menu reader can't draw yet (MenuButtonSprite,
# MenuStringList, MenuScrollBar, MenuScrollArea, MenuActiveWidget), so it
# keeps the placeholder until they are built.
[pages.campaigns]
class = "XInterfaceCTMenus.CTCampaignMenu"
back = "back"

[pages.campaigns.buttons]
OnBButton = "back"
SelectCurrentLevel = "unavailable"

# The four options pages (checked 2026-10-30 with the install). The GAME,
# SOUND, GRAPHICS and CONTROLS buttons switch between them; DONE goes back
# to the page that opened them. Every change is saved straight away, as in
# the original. Rows this port can't do yet are greyed out.
[pages.options]
class = "XInterfaceCTMenus.CTGameOptionsPCMenu"
back = "back"

[pages.options.buttons]
SoundSelected = "switch:options_sound"
GraphicsSelected = "switch:options_graphics"
ControlsSelected = "switch:options_controls"
RestoreToDefaultSelected = "restore_defaults"
DoneSelected = "back"
OnLeft = "option_left"
OnRight = "option_right"

[pages.options.choosers]
"Options[0]" = "mouse_sensitivity"
"Options[1]" = "invert_mouse"
"Options[2]" = "unavailable"        # SUBTITLES: no subtitles yet
"Options[3]" = "unavailable"        # HELMET: the visor frame isn't drawn yet
"Options[4]" = "unavailable"        # PROMPT TEXT: no prompt text yet
"Options[5]" = "difficulty"
"Options[6]" = "unavailable"        # AUTO PULL MANEUVERS
"Options[7]" = "unavailable"        # TACTICAL VISOR MODE
"Options[8]" = "unavailable"        # TACTICAL MODE INTENSITY

# Not in the original: our own button ("PORT +", short enough to fit the
# tab) to the placeholder page with the port's extra settings.
[pages.options.extra_buttons.PortSettings]
copy_of = "Controls"
text = "PORT +"
move_down = 0.05
command = "open:more_settings"

[pages.options_sound]
class = "XInterfaceCTMenus.CTSoundOptionsPCMenu"
back = "back"

[pages.options_sound.buttons]
GameSelected = "switch:options"
GraphicsSelected = "switch:options_graphics"
ControlsSelected = "switch:options_controls"
RestoreToDefaultSelected = "restore_defaults"
DoneSelected = "back"
OnLeft = "option_left"
OnRight = "option_right"

[pages.options_sound.choosers]
"Options[0]" = "unavailable"        # VOICES VOLUME: no voices yet
"Options[1]" = "effects_volume"
"Options[2]" = "music_volume"
"Options[3]" = "unavailable"        # SOUND QUALITY
"Options[4]" = "unavailable"        # 3D SOUND
"Options[5]" = "unavailable"        # EAX (a Windows-only sound system)
"Options[6]" = "unavailable"        # AUDIO CHANNELS

[pages.options_sound.extra_buttons.PortSettings]
copy_of = "Controls"
text = "PORT +"
move_down = 0.05
command = "open:more_settings"

[pages.options_graphics]
class = "XInterfaceCTMenus.CTGraphicsOptionsPCMenu"
back = "back"

[pages.options_graphics.buttons]
GameSelected = "switch:options"
SoundSelected = "switch:options_sound"
ControlsSelected = "switch:options_controls"
SetRecommendedSelected = "restore_defaults"
DoneSelected = "back"
OnLeft = "option_left"
OnRight = "option_right"

[pages.options_graphics.choosers]
"Options[0]" = "unavailable"        # GRAPHICS QUALITY
"Options[1]" = "unavailable"        # BRIGHTNESS
"Options[2]" = "video_resolution"
"Options[3]" = "unavailable"        # TEXTURE QUALITY
"Options[4]" = "unavailable"        # CHARACTER DETAIL
"Options[5]" = "unavailable"        # BUMPMAPPING QUALITY
"Options[6]" = "unavailable"        # BLUR EFFECTS
"Options[7]" = "unavailable"        # BLOOM EFFECTS
"Options[8]" = "unavailable"        # PROJECTORS
"Options[9]" = "unavailable"        # SQUAD SHADOWS
"Options[10]" = "vsync"
"Options[11]" = "unavailable"       # FSAA

[pages.options_graphics.extra_buttons.PortSettings]
copy_of = "Controls"
text = "PORT +"
move_down = 0.05
command = "open:more_settings"

# The controls page shows the keys of the keyboard and mouse, or of the
# controller when that was used last. Choosing a row opens the original
# "reassign button" box.
[pages.options_controls]
class = "XInterfaceCTMenus.CTControlsOptionsPCMenu"
back = "back"

[pages.options_controls.buttons]
GameSelected = "switch:options"
SoundSelected = "switch:options_sound"
GraphicsSelected = "switch:options_graphics"
RestoreToDefaultSelected = "restore_defaults"
DoneSelected = "back"
PrevSetSelected = "prev_set"
NextSetSelected = "next_set"
ActionSelected = "rebind"

[pages.options_controls.keys]
"OptionSet0[0]" = "move_forward"
"OptionSet0[1]" = "move_back"
"OptionSet0[2]" = "unavailable"     # TURN LEFT: turning is the mouse here
"OptionSet0[3]" = "unavailable"     # TURN RIGHT
"OptionSet0[4]" = "strafe_left"
"OptionSet0[5]" = "strafe_right"
"OptionSet0[6]" = "walk"
"OptionSet0[7]" = "jump"
"OptionSet0[8]" = "crouch"
"OptionSet0[9]" = "use"
"OptionSet0[10]" = "fire"
"OptionSet0[11]" = "throw_grenade"
"OptionSet0[12]" = "zoom"
"OptionSet0[13]" = "flashlight"     # CYCLE VISOR MODE (the original's headlamp key)
"OptionSet1[0]" = "unavailable"     # SCREEN SHOT
"OptionSet1[1]" = "melee"           # MELEE ATTACK
"OptionSet1[2]" = "reload"
"OptionSet1[3]" = "unavailable"     # DC15s PISTOL: no key per weapon yet
"OptionSet1[4]" = "unavailable"     # DC17m BLASTER
"OptionSet1[5]" = "unavailable"     # DC17m SNIPER
"OptionSet1[6]" = "unavailable"     # DC17m ANTI-ARMOR
"OptionSet1[7]" = "next_weapon"     # SECONDARY WEAPONS
"OptionSet1[8]" = "next_grenade"    # CYCLE DETONATOR
"OptionSet1[9]" = "squad_search_and_destroy"
"OptionSet1[10]" = "squad_form_up"
"OptionSet1[11]" = "squad_secure_position"
"OptionSet1[12]" = "squad_cancel"   # RECALL
"OptionSet1[13]" = "unavailable"    # SHOW SCORES (multiplayer)
"OptionSet2[0]" = "unavailable"     # SWITCH TEAM (multiplayer)
"OptionSet2[1]" = "quick_load"
"OptionSet2[2]" = "quick_save"
"OptionSet2[3]" = "unavailable"     # CHAT (multiplayer)
"OptionSet2[4]" = "unavailable"     # TEAM CHAT (multiplayer)
"OptionSet2[5]" = "unavailable"     # SPEECH MENU (multiplayer)

[pages.options_controls.extra_buttons.PortSettings]
copy_of = "Graphics"
text = "PORT +"
move_down = 0.1
command = "open:more_settings"
