# Damage types and damage tables, read from the original game.
#
# [parents]: each damage type (a class in the game's script packages,
# engine.u, ctgame.u, ctinventory.u and Properties/properties.u) and the
# type it is a kind of.
#
# Every other section is a damage table (a DamageVariance class in
# Properties/properties.u): a multiplier for each listed damage type. A
# hit uses the entry for its own type, else its parent's, and so on up; no
# entry means x1. The game's "exclude" entries are written as 0.
# Characters name their table with `damage_table` (player.toml and the
# enemy files). Mods can change any number or add tables.

