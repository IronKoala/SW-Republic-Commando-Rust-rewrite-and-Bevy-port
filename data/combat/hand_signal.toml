# The hands the player uses things with: the game's HandSignal "weapon"
# (CTInventory.HandSignal). Using something puts the gun away and brings
# these hands up instead (see crates/rc_combat/src/hands.rs).

[arms]
# The animated model, read from the game at run time (Animations/hudarms.ukx).
mesh = "HudArmsHands"     # game: HandSignal's Mesh (HudArms.HudArmsHands)
fov = 85                  # game: DisplayFOV (HandSignal keeps Weapon's 85)
# NOT from the game files: the same values as the DC-17m's arms, so the
# hands are lit like the gun they replace. The original lights the arms
# in its compiled engine code, which we don't read.
brightness = 0.75
light_scale = 0.85

# One section per thing used: its three moves in HudArmsHandsSet.
# game: HandSignal.SetupBactaHealer
[bacta]
load = "BactaLoad"        # LoadAnim: the hands come up and plug in
fire = "BactaLoop"        # FireAnim: repeated while Use is held
holster = "BactaHolster"  # HolsterAnim: unplug and go down

# The others, from HandSignal.MarkerHandSetup and its Setup functions
# (ctinventory.u). `fire = ""` is the game's FireAnim = '': nothing
# repeats while the hands are up.
# game: SetupHackTerminal (a console, AIT_HackTerminal)
[slice]
load = "KeypadLoad"
fire = "KeypadLoop"
holster = "KeypadHolster"

# game: SetupBreachDoor (a breach lock, AIT_BreachDoor); the job starts
# when the hands put the charge on (the HolsterAttachment moment)
[breach]
load = "SetDoorCharge"
fire = "StartDoorCharge"
holster = "Holster"

# game: SetupDemolition on a charge not yet placed (state Unplaced)
[demolition_place]
load = "SetDemolition"
fire = "KeypadLoop"
holster = "Holster"

# game: SetupDemolition on a charge already placed
[demolition]
load = "Load"
fire = "KeypadLoop"
holster = "Holster"

# game: SetupPlunger (an armed charge, AIT_Plunger); the charge goes off
# at the animation's FireWeapon moment
[plunger]
load = "Detonate"
fire = ""
holster = "Holster"

# game: SetupDefaults (a slice lock: HackDoor is AIT_HackDoor, which
# MarkerHandSetup has no case for)
[defaults]
load = "Load"
fire = "KeypadLoop"
holster = "Holster"
