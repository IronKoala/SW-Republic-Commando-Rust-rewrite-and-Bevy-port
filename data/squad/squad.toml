# Delta Squad settings: who is in the squad, where they stand, and how each
# squad order behaves.
#
# Mods: change any value here and restart. Delete a line to use the
# built-in value. A misspelt name stops the game with an error naming the
# line.
#
# Distances are Unreal units (uu): a commando is 168 uu tall, and runs at
# 450 uu per second. Times are seconds. Where a value is the original
# game's, the comment says which class it was read from (the class defaults
# in the game's script packages, see docs/RESEARCH.md). "Our own" means the
# original keeps it in compiled code we don't read, so we chose it.

[squad]
# Further than this from where they're going, members run; closer, they
# walk. Original: CTBot's AUTORUNDISTANCE.
autorun_distance = 400
# How often each member re-thinks where to go. Original: CloneCommandoBot
# DecisionInterval.
think_interval = 0.25
# Close enough to a spot to stop. Our own.
arrive_radius = 40
# A path point counts as passed when this close. Our own.
waypoint_radius = 64
# Ask for a new path when the spot has moved this far. Our own.
replan_distance = 96
# Turning speed when standing, degrees per second. Our own.
turn_rate = 360
# Seconds a member spends on a marked job that no [job.*] below matches.
# Our own; the original plays an animation of about this length.
marker_work_time = 3
# Search and destroy: how far from the squad's anchor members look for
# enemies. Original: Squad.DefaultSearchAndDestroyRadius.
search_radius = 768
# Where the squad comes from. "with_player": all three start in their
# form-up slots around the player. "none": no squad. (The original brings
# them in through each map's scripts, one by one on Geonosis; the log lists
# where each map would have spawned them.)
spawn = "with_player"

# Where each member stands while following, measured from the leader:
# `forward` along the way the leader faces (negative is behind), `right`
# to the leader's right. Our own; the original works its formation out in
# compiled code. Kept inside the form-up "stop" distance (192 uu) below.
[formation]
slot1 = -130, -110
slot2 = -130, 110
slot3 = -180, 0

# Search and destroy: members spread out ahead of the leader instead.
# Our own.
[formation_search]
slot1 = 200, -220
slot2 = 200, 220
slot3 = 320, 0

# Secure position: members stand around the ordered spot, this far from
# it. Our own.
[formation_secure]
radius = 110

# Each order is a "stance" in the original. Every member is tied (a
# "tether") to something: the leader, the ordered spot ("objective"), or
# where they stood when the order came ("self"). Members stay put while
# they're within `lp_activate` of it. Further away they set off back, and
# stop once they're within `lp_deactivate` of it or at their spot.
# Beyond `hp_activate` the pull is urgent (always run). `prevent_range`
# is how far from it a member may go to fight (and to take cover).
# `seek_cover_after` is how many seconds into a fight a member looks for
# cover (the game's TimeBeforeSeekingCover); `cover_near_tether = "yes"`
# picks the cover nearest what they're tied to rather than nearest
# themselves (the game's FavorCombatNearestTether). Values: the stance's
# class defaults, falling back to SquadStance's.
[stance.form_up]          # F2 in the original. CTGame.StanceFormUp
name = "Form up"
tether = "leader"
lp_activate = 768         # SquadStance
lp_deactivate = 192       # StanceFormUp
hp_activate = 1280        # StanceFormUp
hp_deactivate = 768       # StanceFormUp
prevent_range = 1024      # SquadStance
seek_cover_after = 2      # StanceFormUp
cover_near_tether = "yes" # StanceFormUp

[stance.secure_position]  # F3, aimed at a spot. CTGame.StanceSecurePosition
name = "Secure area"
tether = "objective"
lp_activate = 768         # SquadStance
lp_deactivate = 128       # StanceSecurePosition
hp_activate = 1024        # SquadStance
hp_deactivate = 512       # SquadStance
prevent_range = 640       # StanceSecurePosition
seek_cover_after = 0      # StanceSecurePosition
cover_near_tether = "yes" # StanceSecurePosition

[stance.search_and_destroy]  # F1. CTGame.StanceSearchAndDestroy
name = "Search and destroy"
tether = "leader"         # original: the squad's objective; see docs/DESIGN.md
lp_activate = 512
lp_deactivate = 256
hp_activate = 2048
hp_deactivate = 1280
prevent_range = 1024      # SquadStance
seek_cover_after = 0      # StanceSearchAndDestroy
cover_near_tether = "no"

[stance.hold]             # no key in the PC version. CTGame.StanceHold
name = "Hold"
tether = "self"
lp_activate = 512
lp_deactivate = 256
hp_activate = 768
hp_deactivate = 384
prevent_range = 256
seek_cover_after = 6      # SquadStance
cover_near_tether = "no"

# How squad mates fight. The original decides this in compiled code we
# don't read, so the rules are our own (docs/DESIGN.md, "Squad fighting
# and reviving"); the numbers say where they come from.
[fight]
# Their gun: a file in data/weapons. Delta Squad carries the DC-17m.
weapon = "dc17m_blaster"
# 0 = wild, 1 = perfect. Game: Accuracy in Commando07/40/62DeltaDefaults
# (Properties package); CloneCommando's own is 0.75.
accuracy = 0.9
# Aim error in degrees at accuracy 0; the actual error is
# (1 - accuracy) x this. Our own (same as the droids').
max_aim_error = 10
# Farthest they see an enemy, uu. Game: SightRadius in
# Commando07/40/62DeltaDefaults.
sight_radius = 5000
# Seconds from first seeing an enemy to the first shot. Our own.
reaction_time = 0.5
# Shots per burst, and seconds between them. The gap is the DC-17m's
# fire rate (data/weapons/dc17m_blaster.toml); the burst length is our own.
burst_count = 5
shot_interval = 0.1
# Rest between bursts, shortest and longest, seconds. Our own.
burst_pause_min = 0.6
burst_pause_max = 1.2
# A standing commando shoots only this far off where it faces, degrees.
# Our own (droids: 60, BattleDroid MaxAimYaw).
max_aim_yaw = 60
# Hold fire while the line of fire passes this close to the player's or a
# squad mate's body (the whole 168-tall commando), uu, on top of how far
# the shot can stray. Our own. It used to be measured from the body's
# middle only, which let shots pass over shoulders into friends.
friendly_clearance = 20
# Specialities: each squad mate's `speciality` (a [job.*] key, in the
# [member.*] blocks) is used on their own in fights, with no marker, by the
# job's `auto` rule. The original does this too (Sev snipes, Fixer throws
# grenades, Scorch fires anti-armour rounds), but decides when in compiled
# code we don't read, so the rules and these numbers are our own.
use_specialities = "yes"
# An enemy counts as armoured when the usual gun does no more than this
# share of its damage to it, by its damage table
# (data/combat/damage_types.toml): super battle droids take 0.15 from the
# DC-17m, battle droids 1. Our own.
armoured_below = 0.5
# Seconds to change to or from a speciality gun before firing. Our own.
switch_time = 0.5

# Taking cover in a fight. Squad mates use the map's cover points (the
# level designers' CoverPoint actors, the same ones the droids use): once
# they've fought for their order's `seek_cover_after`, each one heads for
# a free cover point within the order's `prevent_range` that faces the
# enemy and still gives a clear shot when standing, crouches there between
# bursts and stands up to fire. Which point and when to leave are our own
# rules (the original decides in compiled code; docs/DESIGN.md, "Taking
# cover"); the numbers say where they come from.
[cover]
# "yes" or "no". "no" keeps them standing in the open, as before.
use_cover = "yes"
# How far from themselves they look for a cover point, uu. Guess (the
# same as the droids').
search_radius = 1500
# A cover point shields from enemies within this angle around the way it
# faces, degrees (the whole cone). Game: CoverPoint FOVdegrees.
fov = 140
# A cover point with the enemy closer than this is no use, uu. Our own.
min_enemy_distance = 256
# Seconds at one cover point before looking for another. Game: CTBot
# CoverBoredomTime.
boredom_time = 15
# Seconds with no enemy in sight before leaving cover and going back to
# their place in the order. Our own.
calm_time = 4
# Crouch in cover between bursts: "yes" or "no".
crouch = "yes"

# Reviving a downed commando. Squad mates can't die in the original
# (bCannotDie): at 0 health they go down until someone revives them. Who
# goes to revive whom is our own rule (docs/DESIGN.md).
[revive]
# Seconds a squad mate kneels to revive someone. Guess: the original
# revives with the bacta healer (CTInventory.BactaHealer: 5 charges,
# recharging 1 a second), but how fast a revive uses them is compiled code.
time = 3
# Seconds the player holds Use by a downed squad mate. Guess, as above.
player_time = 3
# Health they get back, as a share of their maximum (0 to 1). Guess (not
# stored in the scripts).
health = 0.5
# How close the reviver must be to the body, uu. Our own.
reach = 100
# Squad mates only go to revive someone this close, uu. Our own.
range = 4000
# Squad mates come to revive the player on their own: "yes" or "no".
revive_player = "yes"

# Marked jobs ("context orders"): aim at a squad marker in the map and
# press the squad command key (or Use), and a squad mate does the job.
# A marker gets the first job below whose `match` words (comma separated,
# any case) appear in the class of its order marker (CTMarkers.u classes
# like MarkerDoorBreach, MarkerHackDoor, MarkerSnipe, MarkerGrenade), or,
# for a marker with none (bacta), in the class of the thing it's for (its
# anchor, like BactaDispenserGEO). Mods can change any job or add new
# ones; a missing line keeps the built-in value. "game" in a comment names
# the class the number was read from; the original runs the jobs in
# compiled code we don't read, so the rest is our own or a guess
# (docs/DESIGN.md, "Context orders"; docs/RESEARCH.md, "Squad markers").
#
# kind = "once": walk to the spot, work `work_time` seconds, done; then,
#   after `fuse` seconds, a blast (`blast_damage` at the middle, falling
#   to nothing at `blast_radius` uu) if set, and the `result`:
#   "heal" (the squad mate gets health and shield back), "trigger" (sets
#   off the marker's anchor: the level's door or script reacts), "none".
#   `group = "yes"` sends a squad mate to every spot of the same anchor
#   and starts when all are in place (door breach: stack up, then blow).
# kind = "post": walk to the spot and stay until recalled (F4), fighting
#   from there with `weapon` (a file in data/weapons) and the shooting
#   numbers given (0 or missing = [fight]'s), or throwing a grenade every
#   `throw_interval` seconds (it goes off `throw_fuse` seconds later,
#   `throw_damage` falling to 0 at `throw_radius`): at enemies within
#   `target_radius` of the marker's target area, or, with no area, at
#   their own target within `throw_range`.
#   `pullable = "yes"`: with AUTO PULL MANEUVERS on (the GAME options
#   page, or `auto_pull_maneuvers` in settings.toml), a new order that
#   needs more squad mates than are free takes them off posts like this
#   one, the longest-held first. Off, the order is refused until you
#   recall the squad (the original's "RECALL SQUAD BEFORE ENGAGING
#   MANEUVER").
# preferred: the squad mate (their `class` or key) who takes the job when
#   free; otherwise the nearest free one goes.
# auto: how a squad mate whose `speciality` is this job uses it on their
#   own in a fight (all our own rules): "far" = the job's gun at enemies at
#   least `auto_range` away; "armoured" = the job's gun at armoured enemies
#   (see [fight] armoured_below) at least `auto_range` away, with no friend
#   within `auto_clearance` of them; "group" = the job's throw at their
#   target when at least `auto_min_enemies` enemies are within
#   `throw_radius` of it, it's `auto_range` to `throw_range` away, no
#   friend is within `auto_clearance` of it, at most every
#   `auto_interval` seconds; "no" = only from a marked post.

[job.bacta]
name = "Bacta"
match = "bacta"           # anchors BactaDispenserGEO/RAS/YYY/TRN/CORE
kind = "once"
work_time = 3             # guess (BactaDispenser BactaRate 4: how it's used is compiled code)
result = "heal"

[job.demolition]
name = "Demolition"
match = "demolition"      # MarkerDemolition at a DemolitionCharge
kind = "once"
preferred = "Commando62Delta"  # game: MarkerDemolition PreferredPawnClass (Scorch)
work_time = 3             # guess
result = "trigger"
fuse = 10                 # game: DemolitionCharge ChargePlaced Duration (our reading)
blast_damage = 256        # game: DemolitionCharge ChargeExplode Damage
blast_radius = 256        # game: ChargeExplode DamageRadius

[job.breach]
name = "Breach door"
match = "breach"          # MarkerDoorBreach at a BreachDoor..., three spots
kind = "once"
group = "yes"             # game: three participants (doorman, grenadier, cover)
work_time = 3             # guess
result = "trigger"
fuse = 2.5                # game: BreachDoor DoorChargeLockedState Duration (our reading)
blast_damage = 200        # game: BreachDoor DoorDamagedState Damage
blast_radius = 256        # game: DoorDamagedState DamageRadius

[job.slice]
name = "Slice"
match = "hack, slice"     # MarkerHackDoor and MarkerHackTerminal
kind = "once"
preferred = "Commando40Delta"  # game: PreferredPawnClass (Fixer)
work_time = 8             # guess: slicing takes longer than a charge
result = "trigger"

[job.sniper]
name = "Sniper position"
match = "snipe"           # MarkerSnipe
kind = "post"
pullable = "yes"         # game: MarkerWeapon bCancelIfMembersNeeded (auto pull maneuvers)
preferred = "Commando07Delta"  # game: MarkerSnipe PreferredPawnClass (Sev)
weapon = "dc17m_sniper"   # from the weapons part; the usual gun until it's there
sight_radius = 8000       # guess
accuracy = 1              # game: MarkerSnipe Accuracy
burst_count = 1
shot_interval = 0.1
burst_pause_min = 1.5     # guess
burst_pause_max = 2.5     # guess
auto = "far"              # Sev (the original's Commando07: auto-snipes)
auto_range = 1500         # our own: farther than this counts as far

[job.grenade]
name = "Grenade position"
match = "grenade"         # MarkerGrenade, with a WeaponTarget area
kind = "post"
pullable = "yes"         # game: MarkerWeapon bCancelIfMembersNeeded (auto pull maneuvers)
throw_interval = 6        # guess
throw_range = 1500        # guess (markers with no target area)
throw_fuse = 2            # game: ThermalDetonatorProj FuseTime
throw_damage = 400        # game: CTProjExplosive Damage
throw_radius = 512        # game: CTProjExplosive DamageRadius
target_radius = 512       # game: MarkerWeapon WeaponTargetRadius
auto = "group"            # Fixer (the original's Commando40: auto-grenades)
auto_range = 600          # our own: not at his own feet
auto_interval = 10        # our own
auto_min_enemies = 2      # our own
auto_clearance = 512      # our own: the blast's reach (throw_radius)

[job.anti_armour]
name = "Anti-armour position"
match = "antiarmor, antiarmour"  # MarkerAntiArmor
kind = "post"
pullable = "yes"         # game: MarkerWeapon bCancelIfMembersNeeded (auto pull maneuvers)
preferred = "Commando62Delta"  # game: MarkerAntiArmor PreferredPawnClass (Scorch)
weapon = "dc17m_antiarmor"  # from the weapons part; the usual gun until it's there
burst_count = 1
shot_interval = 0.1
burst_pause_min = 2       # guess
burst_pause_max = 3       # guess
auto = "armoured"         # Scorch (the original's Commando62: auto anti-armour)
auto_range = 600          # our own: out of the blast
auto_clearance = 400      # our own: the round's 800 uu blast falls off; keep friends out of its harder half

[job.turret]
name = "Man turret"
match = "turret"          # MarkerTurret, and spots whose anchor is a turret (yyy_06d's Wookiee heavy turrets)
kind = "post"
pullable = "yes"          # game: MarkerTurretNative bCancelIfMembersNeeded
mount = "yes"             # gets on the anchor and fires the turret (data/turrets/*.toml [auto]), not their own gun

# The squad. `class` is the original's character class (CTCharacters),
# `number` and `name` are what its HUD shows, `hud_slot` its place on the
# HUD (SquadHUDSlot), and `slot` the formation slot above. `colour` is each
# commando's own colour (EnhancedVisionColor in the Properties package's
# CommandoNNDeltaDefaults), used for the stand-in bodies until the real
# models are drawn. Health and shields are the same classes' MaxHealth,
# MaxShields, ShieldRechargeRate (per second) and ShieldRechargeDelay
# (seconds before recharging starts). Squad mates can't die
# (bCannotDie): at 0 health they go down until revived. `speciality` is the
# [job.*] they use on their own in fights (see `auto` above); "" for none.
# `audio_table` is their voice: the class's AudioTable in the game's
# System/CTAudio.u (when they speak is in data/squad/voice.toml).
[member.sev]
class = "Commando07Delta"
name = "Sev"
number = "07"
audio_table = "Delta07Audio"
hud_slot = 1
slot = 1
colour = 0.71, 0.18, 0.17
max_health = 400
max_shields = 50
shield_recharge_rate = 15
shield_recharge_delay = 4
speciality = "sniper"

[member.fixer]
class = "Commando40Delta"
name = "Fixer"
number = "40"
audio_table = "Delta40Audio"
hud_slot = 2
slot = 2
colour = 0.21, 0.49, 0.17
max_health = 400
max_shields = 50
shield_recharge_rate = 15
shield_recharge_delay = 4
speciality = "grenade"

[member.scorch]
class = "Commando62Delta"
name = "Scorch"
number = "62"
audio_table = "Delta62Audio"
hud_slot = 3
slot = 3
colour = 0.85, 0.80, 0.13
max_health = 400
max_shields = 50
shield_recharge_rate = 15
shield_recharge_delay = 4
speciality = "anti_armour"
