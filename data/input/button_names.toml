# Names shown in button prompts ("Press X to use"), for each kind of
# controller, keyboard and mouse. Mods and players can change any line.
#
# Gamepad buttons are named by where they sit, as in bindings.toml: South is
# the bottom face button, East the right one, and so on. So "South" is A on
# Xbox, Cross on PlayStation and B on Switch. The back paddles (Steam Deck
# L4/R4/L5/R5, Xbox Elite, DualSense Edge), Touchpad and Misc1 (Share,
# Capture, Mute) are only read when SDL reads the controllers.
#
# A controller looks in its own section first (ps5, joycon_pair, ...), then
# its family's (xbox, playstation, nintendo, steam_deck), then [generic].
# Kinds: xbox, ps4, ps5, switch_pro, joycon_left, joycon_right,
# joycon_pair, gamecube, steam_deck, steam, generic.
#
# PLACEHOLDER: these are words. The original PC game has no controller
# button pictures, so pictures need new art (a mod can add them later).

[xbox]
South = "A"
East = "B"
West = "X"
North = "Y"
LeftTrigger = "LB"
LeftTrigger2 = "LT"
RightTrigger = "RB"
RightTrigger2 = "RT"
Select = "View"
