# Sonic detonator: a sticky mine. It sticks to the level or a character
# it hits, then goes off when a character comes within 400 uu (checked
# twice a second), or after 10 s.
#
# Mods: change any value and restart. A misspelt name stops loading this
# file with an error naming the line (see logs/rc_game.log).
#
# Numbers marked "game:" are the original's class defaults, read from its
# script packages (ctinventory.u, with the "...Defaults" class in
# Properties/properties.u on top). "our choice" marks the few that are ours.
# Distances are Unreal units (uu, about 1.1 cm). Times are seconds.

name = "Sonic Detonator"  # game: SonicDetonator ItemName

[ammo]
max_count = 5             # game: SonicDetonatorAmmoDefaults MaxAmmo
start_count = 2           # game: SonicDetonatorDefaults InitAmmoAmount

[throw]
speed = 2200              # game: GrenadeProj Speed
toss_up = 200             # game: GrenadeProj TossZ
offset = [57.4, -30, -10.56] # game: Weapon FPGrenadeOffset
delay = 1.0               # our choice

[fuse]
time = 10                 # game: SonicDetonatorProjDefaults FuseTime
after_impact = 10         # game: SonicDetonatorProjDefaults PostImpactFuseTime
proximity = 400           # game: ExplosionProximity (bProximityDetonate)
proximity_interval = 0.5  # game: SonicDetonatorProj ElapseTime

[flight]
stick_to_world = true     # game: SonicDetonatorProj bStickToWorld
stick_to_actors = true    # game: SonicDetonatorProjDefaults bStickToActors
bounce = 0.3              # game: GrenadeProj BounceDampening
actor_bounce = 0.1        # game: GrenadeProj ActorBounceDampening
rest_speed = 20           # game: CTProjExplosive RestSpeed
gravity = 1100            # game: level gravity

[blast]
damage = 400              # game: SonicDetonatorProjDefaults Damage
radius = 800              # game: DamageRadius
damage_type = "CTDamageExplosionSonic" # game: MyDamageType
damage_kind = "sonic"

[sound]
# The blast sound is the SpawnSound of the grenade's ExplosionEffect
# (an Emitter class in Properties/cteffects.u). Not read: the game may use
# another effect for some surfaces (HitEffectsByMaterial).
package = "gen_sound"
blast = "exp_GEN_tanker_01" # game: SonicDetonatorProjDefaults ExplosionEffect Grenade_Sonic_Explo, its SpawnSound

[model]
mesh = "GeoGrenade"       # game: StaticMesh (not drawn yet)
blast_colour = [0.4, 1.0, 0.6]   # our choice
