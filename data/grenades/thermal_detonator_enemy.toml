# The enemies' thermal detonator (ThermalDetonatorEnemy): what Trandoshan
# mercenaries throw. The same grenade as the player's, but it hurts half as
# much and is hurt-typed as a plain explosion.
#
# Mods: change any value and restart. A misspelt name stops loading this
# file with an error naming the line (see logs/rc_game.log).
#
# Numbers marked "game:" are the original's class defaults, read from its
# script packages (ctinventory.u, with ThermalDetonatorEnemyProjDefaults in
# Properties/properties.u on top). "our choice" marks the few that are ours.
# Distances are Unreal units (uu, about 1.1 cm). Times are seconds.

name = "Thermal Detonator"   # game: ThermalDetonator ItemName

[ammo]
max_count = 5             # game: ThermalDetonator PickupAmmoCount
start_count = 2           # game: ThermalDetonatorEnemyDefaults InitAmmoAmount (each enemy's count is in its own file's [grenades])

[throw]
speed = 2200              # game: GrenadeProj Speed (the fastest an enemy throws; it aims its own arc)
toss_up = 200             # game: GrenadeProj TossZ (unused for enemy throws: the arc is aimed)
offset = [57.4, -30, -10.56] # game: Weapon FPGrenadeOffset
delay = 1.0               # our choice

[fuse]
time = 12                 # game: ThermalDetonatorEnemyProjDefaults FuseTime
after_impact = 1          # game: CTProjExplosive PostImpactFuseTime

[flight]
bounce = 0.3              # game: GrenadeProj BounceDampening
actor_bounce = 0.1        # game: GrenadeProj ActorBounceDampening
rest_speed = 20           # game: CTProjExplosive RestSpeed
gravity = 1100            # game: LevelInfo/PhysicsVolume gravity

[blast]
damage = 200              # game: ThermalDetonatorEnemyProjDefaults Damage
radius = 600              # game: ThermalDetonatorEnemyProjDefaults DamageRadius
damage_type = "CTDamageExplosion" # game: CTProjExplosive MyDamageType (the enemy version doesn't change it)
damage_kind = "explosion"

[status]
# game: ExplosionStatusEffect StatusEffect_Immolate (burning)
max_time = 12             # game: StatusEffectMaxDuration
damage_per_sec = 15       # game: StatusEffectDamagePerSec
radius_change = -400      # game: StatusEffectRadiusModifier (burns within 200 uu)
damage_type = "CTDamageFire" # game: StatusEffect_Immolate DamageType
damage_kind = "fire"
stops = false             # our reading: burning hurts but doesn't stop anyone

[sound]
package = "gen_sound"
bounce = "imp_GEN_grenadeBounce_01" # placeholder: the player's bounce sound (the enemy version names none)

[model]
mesh = "ThermalDetonator" # game: StaticMesh
blast_colour = [1.0, 0.6, 0.2]   # our choice: colour of the stand-in flash
