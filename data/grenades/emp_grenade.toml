# EC detonator (EMP grenade): no blast damage, but electrocutes everything
# it can see within 1024 uu for up to 9 s at 50 damage a second. Droids
# take it hardest; organics and clone commandos less (their damage tables).
#
# Mods: change any value and restart. A misspelt name stops loading this
# file with an error naming the line (see logs/rc_game.log).
#
# Numbers marked "game:" are the original's class defaults, read from its
# script packages (ctinventory.u, with the "...Defaults" class in
# Properties/properties.u on top). "our choice" marks the few that are ours.
# Distances are Unreal units (uu, about 1.1 cm). Times are seconds.

name = "EC Detonator"     # game: EMPGrenadeDefaults ItemName

[ammo]
max_count = 5             # game: EMPGrenadeAmmoDefaults MaxAmmo
start_count = 2           # game: EMPGrenadeDefaults InitAmmoAmount

[throw]
speed = 2200              # game: GrenadeProj Speed
toss_up = 200             # game: GrenadeProj TossZ
offset = [57.4, -30, -10.56] # game: Weapon FPGrenadeOffset
delay = 1.0               # our choice

[fuse]
time = 12                 # game: EMPGrenadeProjDefaults FuseTime
after_impact = 1          # game: CTProjExplosive PostImpactFuseTime

[flight]
bounce = 0.3              # game: GrenadeProj BounceDampening
actor_bounce = 0.1        # game: GrenadeProj ActorBounceDampening
rest_speed = 20           # game: CTProjExplosive RestSpeed
gravity = 1100            # game: level gravity

[blast]
damage = 0                # game: EMPGrenadeProj Damage
radius = 1024             # game: EMPGrenadeProjDefaults DamageRadius
damage_type = "CTDamageElectricityEMPGrenade" # game: MyDamageType
damage_kind = "electrical"

[status]
# game: ExplosionStatusEffect StatusEffect_ElectrocuteEMPGrenade
max_time = 9              # game: StatusEffectMaxDuration
damage_per_sec = 50       # game: StatusEffectDamagePerSec
damage_type = "CTDamageElectricityEMPGrenade" # game: the status effect's DamageType
damage_kind = "electrical"
half_on_commandos = true  # game: electrocution lasts half as long on clone commandos

[sound]
package = "gen_sound"
bounce = "imp_GEN_grenadeBounce_01" # game: ImpactSound

[model]
mesh = "EMPGrenade"       # game: StaticMesh (not drawn yet)
blast_colour = [0.4, 0.7, 1.0]   # our choice
