# Automatic checks. Every pull request and every push to main is built and
# tested on Windows and Linux by GitHub's own machines.
#
# Game files are never on GitHub, so RC_GAME_DIR is not set here. Tests must
# not need the game; a test that does should print "skipped" and pass.
# No secrets or tokens are used.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller build folder, so the cache stays small and fast.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Bevy needs sound, gamepad and window libraries on Linux.
      - name: Install Linux libraries for Bevy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Build everything
        run: cargo build --workspace --all-targets --locked

      - name: Run the tests
        run: cargo test --workspace --locked

  # Style checks. They report problems but never fail the run (for now).
  lint:
    name: Formatting and clippy (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux libraries for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Formatting (cargo fmt)
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked
