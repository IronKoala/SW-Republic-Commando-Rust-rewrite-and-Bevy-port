# One workspace, many small crates (layout idea from vladtrc/iw4L and
# samwhosung/benilla). File-format readers stay plain Rust with no Bevy in
# them, so they can be built and tested on their own.
[workspace]
resolver = "2"
members = ["crates/rc_ai", "crates/rc_anim", "crates/rc_audio", "crates/rc_character", "crates/rc_combat", "crates/rc_game", "crates/rc_game_core", "crates/rc_image", "crates/rc_level", "crates/rc_level_viewer", "crates/rc_movement", "crates/rc_nav", "crates/rc_package", "crates/rc_probe", "crates/rc_soundtest", "crates/rc_viewer", "crates/rc_walk"]

[workspace.package]
edition = "2021"
