# One workspace, many small crates (layout idea from vladtrc/iw4L and
# samwhosung/benilla). File-format readers stay plain Rust with no Bevy in
# them, so they can be built and tested on their own.
[workspace]
resolver = "2"
members = ["crates/rc_ai", "crates/rc_anim", "crates/rc_audio", "crates/rc_cast", "crates/rc_character", "crates/rc_combat", "crates/rc_effects", "crates/rc_effects_plugin", "crates/rc_enemies", "crates/rc_game", "crates/rc_game_core", "crates/rc_hologram", "crates/rc_image", "crates/rc_level", "crates/rc_level_plugin", "crates/rc_level_viewer", "crates/rc_menus", "crates/rc_model", "crates/rc_movement", "crates/rc_movers", "crates/rc_movers_plugin", "crates/rc_music", "crates/rc_nav", "crates/rc_package", "crates/rc_pads", "crates/rc_panini", "crates/rc_physics", "crates/rc_probe", "crates/rc_save", "crates/rc_scripts", "crates/rc_scripts_plugin", "crates/rc_shadows", "crates/rc_soundtest", "crates/rc_squad", "crates/rc_squad_plugin", "crates/rc_turrets", "crates/rc_turrets_plugin", "crates/rc_video", "crates/rc_viewer", "crates/rc_visor", "crates/rc_walk"]

[workspace.package]
edition = "2021"

# The menu background video is decoded on the CPU every frame it changes.
# Unoptimised (debug) builds decode one 512x512 frame in about 70 ms, so a
# debug run (the cloud test script) could never keep up with 30 frames a
# second and slowed to a crawl. The decoder and the library it uses
# (oxideav) are always built optimised; release builds are unchanged
# (about 5 ms a frame on the cloud's CPU).
[profile.dev.package.rc_video]
opt-level = 3

[profile.dev.package.oxideav-msmpeg4]
opt-level = 3

[profile.dev.package.oxideav-core]
opt-level = 3
