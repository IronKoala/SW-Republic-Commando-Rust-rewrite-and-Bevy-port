[package]
name = "rc_scripts"
version = "0.1.0"
edition.workspace = true
description = "Runs a map's level scripting (scripted triggers and sequences, triggers, counters, conditions, checkpoints) as events and tags, with no Bevy."

[dependencies]
rc_level = { path = "../rc_level" }
rc_package = { path = "../rc_package" }
# Reading our settings file. serde (MIT OR Apache-2.0), https://serde.rs;
# toml (MIT OR Apache-2.0), https://github.com/toml-rs/toml.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
