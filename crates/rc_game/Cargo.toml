[package]
name = "rc_game"
version = "0.1.0"
edition.workspace = true
description = "The game: one program with the menus, settings, input, on-screen display and music, that every other part plugs into."

[features]
# Read controllers and gyros with SDL3 (see crates/rc_pads). Building it
# needs CMake; `--no-default-features` builds without it, using gilrs and
# no gyro.
default = ["sdl"]
sdl = ["rc_pads/sdl"]

[dependencies]
rc_game_core = { path = "../rc_game_core" }
# Without its default features, so `--no-default-features` here really
# builds without SDL.
rc_pads = { path = "../rc_pads", default-features = false }
rc_panini = { path = "../rc_panini" }
rc_image = { path = "../rc_image" }
rc_menus = { path = "../rc_menus" }
rc_movement = { path = "../rc_movement" }
# Reading our TOML settings files. serde (MIT OR Apache-2.0),
# https://serde.rs; toml (MIT OR Apache-2.0), https://github.com/toml-rs/toml.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# PLUGINS FROM OTHER PARTS: add the crates of the level, weapons, enemies
# and squad parts here (see docs/PLUGINS.md).
rc_level_plugin = { path = "../rc_level_plugin" }
rc_movers_plugin = { path = "../rc_movers_plugin" }
rc_combat = { path = "../rc_combat" }
rc_enemies = { path = "../rc_enemies" }
rc_squad_plugin = { path = "../rc_squad_plugin" }
rc_save = { path = "../rc_save" }

# Bevy (MIT OR Apache-2.0), https://bevy.org. The 3D renderer, a window on
# X11 or Wayland, menus and text (bevy_ui with Bevy's built-in font), audio
# with Ogg Vorbis for the game's music and WAV for the menus' sounds,
# gamepads (gilrs) and game states.
[dependencies.bevy]
version = "0.20.1"
default-features = false
features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "default_font",
    "bevy_audio",
    "vorbis",
    "wav",
    "bevy_gilrs",
]

# Android only (see docs/ANDROID.md): BLAKE3 hashing (CC0 OR Apache-2.0,
# used inside Bevy) without its C code, and Bevy's native Android start-up.
[target.'cfg(target_os = "android")'.dependencies]
blake3 = { version = "1.8", features = ["pure"] }

[target.'cfg(target_os = "android")'.dependencies.bevy]
version = "0.20.1"
default-features = false
features = ["android-native-activity"]
