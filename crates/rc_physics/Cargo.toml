[package]
name = "rc_physics"
version = "0.1.0"
edition.workspace = true
description = "Loose physics props in the game: rocks, crates and debris that fall, get pushed by shots, blasts and the levels' MegaForce pushers, and the rock slides level scripts make, following the original's Karma rules."

[dependencies]
rc_combat = { path = "../rc_combat" }
rc_effects_plugin = { path = "../rc_effects_plugin" }
rc_game_core = { path = "../rc_game_core" }
rc_level = { path = "../rc_level" }
rc_level_plugin = { path = "../rc_level_plugin" }
rc_level_viewer = { path = "../rc_level_viewer" }

# Avian (MIT OR Apache-2.0), https://github.com/avianphysics/avian: the
# rigid body physics that stands in for the original's Karma engine. Only
# 3D with f32 parry shapes; no debug drawing, no mesh colliders.
[dependencies.avian3d]
version = "0.8.0"
default-features = false
features = ["3d", "parry-f32", "parallel"]

# Bevy (MIT OR Apache-2.0), https://bevy.org.
[dependencies.bevy]
version = "0.20.1"
default-features = false
features = ["std", "bevy_state", "3d_bevy_render"]
