[package]
name = "rc_effects"
version = "0.1.0"
edition.workspace = true
description = "Particle effects (explosions, sparks, smoke): reads the game's Emitter classes from its script packages and runs them, with no Bevy."

[dependencies]
rc_package = { path = "../rc_package" }
# Reading the effects a map places (each actor's own values and its own
# copies of its emitters).
rc_level = { path = "../rc_level" }
